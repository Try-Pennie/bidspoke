# TEST ONLY. A slim, hand trimmed pnpm 9 lockfile for the fixture catalogue, so a
# test can bump a version in a copy of it without touching the repository's.
# The snapshots keep one real chain from @eslint/js down to a leaf
# (@eslint/js -> eslint -> esquery -> estraverse) and drop every other dependency
# eslint really has, so it shows the closure's shape, not eslint's true closure.
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      husky:
        specifier: ^9.1.7
        version: 9.1.7

  packages/service-catalogue:
    devDependencies:
      '@eslint/js':
        specifier: ^10.0.1
        version: 10.0.1(eslint@10.6.0(jiti@2.7.0))
      typescript:
        specifier: ^6.0.3
        version: 6.0.3

snapshots:

  '@eslint/js@10.0.1(eslint@10.6.0(jiti@2.7.0))':
    optionalDependencies:
      eslint: 10.6.0(jiti@2.7.0)

  eslint@10.6.0(jiti@2.7.0):
    dependencies:
      esquery: 1.7.0
    optionalDependencies:
      jiti: 2.7.0
    transitivePeerDependencies:
      - supports-color

  esquery@1.7.0:
    dependencies:
      estraverse: 5.3.0

  estraverse@5.3.0: {}

  husky@9.1.7: {}

  jiti@2.7.0: {}

  typescript@6.0.3: {}
