# bidspoke-worker-ops: the minimal ops Worker (#1705, plan 0.R).
#
# One public route, POST /porting/capture/:hashid, receiving the porting
# recorder's captures from Pipedream. Not public: a SELF binding to its own
# OpsInternal entrypoint (#1946, below), the minute cron (#1949) and its binding
# to the bidding Worker's OpsGateway entrypoint. It shares this package's source and dependencies but
# is a SEPARATE Worker: its own name, its own bindings, its own secrets, and
# none of the money Worker's (no Supabase key, no partner credentials, no KV, and
# none of its Durable Objects: ops binds only its own class, below, #2334). The
# full ops Worker grows from this in plan 0.E.
#
# Deployed by the Deploy Ops Worker job in .github/workflows/deploy.yml (#1709
# part 4), whenever the worker sources change, after Deploy Ops Outbound and the
# step that makes sure the ops code namespace exists. That job then proves
# ops.trypennie.dev is answered by this Worker (.github/scripts/prove-ops-host.sh).
# The bucket, the namespace, the outbound Worker and the master secret were
# created on 2026-10-06; docs/disaster-recovery.md says how to recreate each.
name = "bidspoke-worker-ops"
main = "src/ops/index.ts"
compatibility_date = "2024-09-23"
account_id = "3e7f907a9c19e51417873e2cce4fbc5c"

# No workers.dev address: the only way in is the route described below.
workers_dev = false

# The ops Worker's only way in is the route ops.trypennie.dev/porting/*, and it is
# NOT declared here: CI's Cloudflare token cannot manage zone routes (the first
# Deploy Ops Worker run, 37535186964 on 2026-10-06, uploaded the Worker and then
# failed on /zones/.../workers/routes). The route was created on 2026-10-06 by a
# local deploy and lives in Cloudflare, like the bidding Worker's *.trypennie.dev
# route: see docs/disaster-recovery.md, configuration that exists only in a
# dashboard. A deploy without routes leaves an existing route in place, and every
# Deploy Ops Worker run proves it still answers (.github/scripts/prove-ops-host.sh).
# It wins over the bidding Worker's wildcard because it is more specific. `ops` is
# in RESERVED_SUBDOMAINS (routes/api/endpoints.ts), so no endpoint can take it.

# Captures, redacted before they are written. A bucket lifecycle rule deletes
# every object 90 days after it was written (the retention ceiling, plan 0.R);
# the rule is set on the bucket, not here (created 2026-10-06, #1709 part 4).
[[r2_buckets]]
binding = "PORTING_TEE"
bucket_name = "bidspoke-porting-tee"

# The lane this Worker serves. src/ops/index.ts refuses every request, by name,
# when this is unset or names another lane (#1709).
[vars]
LANE = "ops"
# OPS_RESEAL is set here ONLY during a rotation of the ops key (#2333,
# docs/disaster-recovery.md, rotating the ops private key, step 3): "preview",
# then "apply", makes the minute cron reseal every ops connection login still
# under an old kid (src/ops/reseal-live.ts). Unset, nothing is resealed.
# Set 2026-10-19 for the practice rotation (#2333): kid ops-2026-10 to
# ops-2026-10-19, preview first.
OPS_RESEAL = "preview"

# The ops code namespace (#1709, plan 0.E): where ops workflows' code nodes will
# run, apart from the bidding namespace (bidspoke-code-nodes) and the compare
# one. Every request a script there makes goes to bidspoke-ops-outbound
# (apps/ops-outbound), which refuses it until Phase 2 defines what ops code may
# reach. Nothing dispatches here yet. The Deploy Ops Worker job makes sure the
# namespace exists before deploying (ensure-compare-namespace.sh).
[[dispatch_namespaces]]
binding = "CODE_NODES_OPS"
namespace = "bidspoke-code-nodes-ops"
outbound = { service = "bidspoke-ops-outbound" }

# Self-dispatch (#1946, the #1698 run engine's Spike 0): a service binding to this
# Worker's OWN named entrypoint, OpsInternal (src/ops/internal.ts). It is script
# config, not a zone route, so CI's token can deploy it, and a named entrypoint is
# unreachable from the public edge, which only ever invokes the default export.
# Never an HTTP fetch of ops.trypennie.dev: that would put the internal surface on
# the public route. apps/web/src/lib/__tests__/ops-worker-config.test.ts allows
# exactly two service bindings, this one and OPS_GATEWAY below, each to a named
# entrypoint and never to either Worker's default export.
[[services]]
binding = "SELF"
service = "bidspoke-worker-ops"
entrypoint = "OpsInternal"

# The bidding Worker's OpsGateway entrypoint (#1949, Dan's decision 4 of
# 2026-10-16): the ops workflows' state, which the bidding database is the one
# home of, and the minute cron's heartbeat and report, which the bidding Worker
# watches so the watchdog does not depend on this Worker (L71). A NAMED
# entrypoint, never the bidding Worker's default export, whose fetch handler is
# its public API: apps/web/src/lib/__tests__/ops-worker-config.test.ts allows
# this one binding into it and no other. Deploy Ops Worker waits for Deploy
# Worker, so the entrypoint exists before a deploy binds it.
[[services]]
binding = "OPS_GATEWAY"
service = "bidspoke-worker"
entrypoint = "OpsGateway"

# The first ops Durable Object (#2334, phase 4 of #1689): ConnectionTokenObject,
# one per person bound connection, which will hold its OAuth refresh single
# flight (Phase 5). It is this Worker's OWN class, exported from src/ops/index.ts:
# never a script_name, so ops never reaches the bidding Worker's objects (Hard
# Rule 1). apps/web/src/lib/__tests__/ops-worker-config.test.ts allows a binding
# only to a class ops exports and one of the migrations below creates. Inert in
# the deploy that adds it: nothing calls it.
[[durable_objects.bindings]]
name = "CONNECTION_TOKENS"
class_name = "ConnectionTokenObject"

# The ops Worker's own Durable Object migrations, separate from wrangler.toml's
# (the bidding Worker's, at v5). One way (ADR 0011): once v1 is deployed, no
# rollback may cross it, so the first deploy carrying v1 is the ops Worker's
# rollback floor, recorded in docs/disaster-recovery.md. A class is never renamed
# or deleted in the release that stops using it.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConnectionTokenObject"]

# The run engine's minute cron (#1949, B2): scheduled() in src/ops/index.ts runs
# one tick of src/ops/tick.ts, in observe mode. Always stated, never left out
# (#1946): wrangler deploy leaves a Worker's existing schedules in place when the
# config names none. A new cron first fires about 16 minutes after the deploy
# that adds it, and its scheduledTime lands at :48 within the minute (spike,
# docs/ops-ceilings-spike.md), so nothing keys on either. Deploy Ops Worker
# checks the deploy's own output lists this schedule.
[triggers]
crons = ["* * * * *"]

# Traces go to the tail consumer, which skips this Worker's traces until Phase 1
# points it at the ops database (apps/worker-tail, #1709): an ops execution id
# names nothing in the bidding database's workflow_executions.
[[tail_consumers]]
service = "bidspoke-worker-tail"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Secrets (set via `wrangler secret put <NAME> --config wrangler.ops.toml`):
#   PORTING_CAPTURE_MASTER  derives each workflow's capture key (HMAC of the
#                           hashid), the redaction key and the minute cron's
#                           dispatch key (src/ops/dispatch-auth.ts, #1949).
#                           Cannot be re derived if lost: escrow it with the
#                           other recovery keys.
#   OPS_SUPABASE_URL        the ops database ("Bidspoke Ops"), and
#   OPS_SUPABASE_SECRET_KEY a named secret key (sb_secret_...) Dan creates for
#                           this Worker, which acts as service_role
#                           (src/ops/ops-db.ts). Not the legacy service_role key:
#                           the project's legacy keys are disabled. The minute
#                           cron (#1949) needs both, and while either is unset
#                           it reports not_configured, naming it, every minute,
#                           and the bidding Worker pages. Never the bidding
#                           database's URL or key, which the client refuses.
