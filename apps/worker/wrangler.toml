name = "bidspoke-worker"
main = "src/index.ts"
# Bumped 2024-05-24 -> 2024-09-23 on 2026-06-12 so node-postgres (pg) bundles:
# its transitive deps require() bare node builtins (fs, stream), which only
# resolve under the nodejs_compat v2 runtime that becomes default on this date.
# pg backs the Hyperdrive execution-log writer (lib/pg-writer.ts). This is the
# one runtime-affecting change in that work; the pg path itself stays dormant
# until the HYPERDRIVE binding below is provisioned.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "3e7f907a9c19e51417873e2cce4fbc5c"

# Smart Placement was evaluated and turned off 2026-04-22. Pennie users are in
# NYC / Florida, and trypennie.my.salesforce.com is in AWS us-east-1 — default
# CF placement at the user's closest PoP (EWR/MIA) is already within ~20ms of
# Salesforce. Smart Placement's extra PoP→PoP relay added latency rather than
# removing it, and its learning phase made measurements unstable across deploys.
# If the user base shifts west of the Mississippi, reconsider.
# [placement]
# mode = "smart"

# Workers KV — workflow definition cache + idempotency
[[kv_namespaces]]
binding = "WORKFLOW_CACHE"
id = "14d18007ddf642f6a5298c8a4a482ebd"
preview_id = "d1541f6fb5424cb0baab17bdf64293d6"

[[kv_namespaces]]
binding = "IDEMPOTENCY"
id = "741da5a97205465eb7f12437f24a2dd2"
preview_id = "6f19293c62f84fedb5d0d418fcd5c6ef"

# Data Store — generic workflow-author KV with TTL (PRD: Data Store node).
# Backs the `data_store` node type. First consumer is the main-flow Submission__c
# → engine UUID cache (7-day TTL), but the namespace is intentionally generic so
# any workflow can read/write key/value pairs.
# Create with: `wrangler kv namespace create SUBMISSIONS` and paste IDs below.
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "a7c2fdab1ab14b1fa277d71f85174ba7"
preview_id = "69efde707c3747068059bfd2d3220986"

# Durable Objects — daily caps + circuit breakers
[[durable_objects.bindings]]
name = "DAILY_CAP"
class_name = "DailyCapObject"

[[durable_objects.bindings]]
name = "CIRCUIT_BREAKER"
class_name = "CircuitBreakerObject"

[[migrations]]
tag = "v1"
new_classes = ["DailyCapObject", "CircuitBreakerObject"]

# Dynamic Workers — code node sandboxing via Workers for Platforms
[[dispatch_namespaces]]
binding = "DYNAMIC_WORKER_LOADER"
namespace = "bidspoke-code-nodes"

# Hyperdrive — RETIRED 2026-06-20. The direct-Postgres execution-log hot path
# (lib/pg-writer.ts) was provisioned 2026-06-12 to dodge the nightly
# partition-purge schema-cache 503s. Two things made it not worth keeping:
#   1. Its direct-pg credential went stale (the DB password rotated), so it
#      failed auth on ~every write all day 2026-06-20 — falling back to PostgREST
#      each time (runs stayed healthy, but the "Execution-log DB path degraded"
#      alert fired continuously).
#   2. Its original reason is mostly gone: the nightly purge is now TRUNCATE-based
#      (migration 20260619000001) and no longer reloads the PostgREST schema cache;
#      only the weekly Sun 04:00 UTC reaper still does a DROP.
# The engine falls back to PostgREST automatically when the binding is absent
# (hyperdriveEnabled() in lib/pg-writer.ts), so removing it is non-breaking — and
# with no binding the pg path never runs, so the fallback alert can't fire.
#
# The pg-writer.ts + step-logger fallback code stays dormant and re-enableable:
# to bring it back, recreate/repoint the CF Hyperdrive config with a CURRENT
# Supabase pooler connection string and restore the `[[hyperdrive]]` block below.
# The orphaned CF config d20e883f2ffb4809b9b80d1ff30933c0 can be deleted separately.
#
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "d20e883f2ffb4809b9b80d1ff30933c0"

# Custom endpoint routing — partner subdomains (e.g. tripoint.trypennie.dev)
# The worker reads the Host header to route *.trypennie.dev requests.
# Route *.trypennie.dev/* → bidspoke-worker is configured in the CF dashboard
# (trypennie.dev zone → Workers Routes) rather than here, because the CI token
# lacks Zone:Workers Routes:Edit permission and wrangler would fail the deploy.

# Public vars
[vars]
SUPABASE_JWKS_URL = "https://xvrmivmpfykwwtriqwpg.supabase.co/auth/v1/.well-known/jwks.json"
PII_REDACTION_FIELDS = ""  # empty = disabled; e.g. "ssn,*.date_of_birth,credit_score" to enable
APP_URL = "https://bidspoke.trypennie.dev"
GITHUB_REPO = "Try-Pennie/bidspoke-workflows"  # target repo for workflow definition backups (PRD 3.2)
# External reachability target for the volume-cliff self-check. Stable bidspoke-owned
# hostname that routes to this worker (GET returns 200). Keep off personal subdomains.
SELF_CHECK_URL = "https://hook.trypennie.dev/"

# Scheduled cron triggers:
#   "0 9 * * *"     daily 09:00 UTC — sightings export to Snowflake (overnight ET)
#   "0 13 * * *"    daily 13:00 UTC — volume anomaly check (9am EDT; 8am EST in winter)
#   "0 * * * *"     hourly          — sync partner_bid_configs from Salesforce
#   "* * * * *"     every 1 min     — pre-warm KV + outbound connection pool
#                                    (SF token fetch exercises the SF HTTPS pool;
#                                    CF's outbound keep-alive times out at ~60-90s
#                                    so a 1-min cadence keeps it warm)
[triggers]
crons = ["0 9 * * *", "0 13 * * *", "0 * * * *", "* * * * *"]

# R2 bucket (Logpush destination, Phase 3) — configured via CF dashboard/API, NOT via wrangler binding.
# Logpush writes directly to R2 at the CF infrastructure level; the Worker does not read/write R2.
# To enable: create bucket "bidspoke-logs" in CF dashboard, then create a Logpush job:
#   curl -X POST "https://api.cloudflare.com/client/v4/accounts/{account_id}/logpush/jobs" \
#     -H "Authorization: Bearer {token}" \
#     -d '{"name":"bidspoke-worker-logs","destination_conf":"r2://bidspoke-logs/logs/{DATE}?account-id={ACCOUNT}&access-key-id={KEY}&secret-access-key={SECRET}",
#          "dataset":"workers_trace_events","logpull_options":"fields=Event,EventTimestampMs,Outcome,Logs,ScriptName&timestamps=unixnano"}'
# After confirming Logpush is active, set logpush_active = 'true' in Supabase app_config.

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# Tail consumer — receives a TraceItem per request with true cpuTime,
# adds the main-Worker cost slice onto workflow_executions.cost_usd.
# See apps/worker-tail for the consumer code.
[[tail_consumers]]
service = "bidspoke-worker-tail"

# Secrets (set via `wrangler secret put`):
#   SUPABASE_URL
#   SUPABASE_SECRET_KEY
#   SUPABASE_PUBLISHABLE_KEY
#   API_KEY_MAP            — JSON: { "key": "source_name", ... }
#   CLOUDFLARE_API_TOKEN   — for syncing Worker secrets via CF API
#   CLOUDFLARE_ACCOUNT_ID  — Pennie account: 3e7f907a9c19e51417873e2cce4fbc5c
