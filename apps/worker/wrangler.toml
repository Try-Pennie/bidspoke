name = "bidspoke-worker"
main = "src/index.ts"
compatibility_date = "2024-05-24"
compatibility_flags = ["nodejs_compat"]
account_id = "3e7f907a9c19e51417873e2cce4fbc5c"

# Workers KV — workflow definition cache + idempotency
[[kv_namespaces]]
binding = "WORKFLOW_CACHE"
id = "14d18007ddf642f6a5298c8a4a482ebd"
preview_id = "d1541f6fb5424cb0baab17bdf64293d6"

[[kv_namespaces]]
binding = "IDEMPOTENCY"
id = "741da5a97205465eb7f12437f24a2dd2"
preview_id = "6f19293c62f84fedb5d0d418fcd5c6ef"

# Durable Objects — daily caps + circuit breakers
[[durable_objects.bindings]]
name = "DAILY_CAP"
class_name = "DailyCapObject"

[[durable_objects.bindings]]
name = "CIRCUIT_BREAKER"
class_name = "CircuitBreakerObject"

[[migrations]]
tag = "v1"
new_classes = ["DailyCapObject", "CircuitBreakerObject"]

# Dynamic Workers — code node sandboxing via Workers for Platforms
[[unsafe.bindings]]
name = "DYNAMIC_WORKER_LOADER"
type = "dynamic_dispatch"
namespace = "bidspoke-code-nodes"

# Public vars
[vars]
SUPABASE_JWKS_URL = "https://xvrmivmpfykwwtriqwpg.supabase.co/auth/v1/.well-known/jwks.json"
PII_REDACTION_FIELDS = ""  # empty = disabled; e.g. "ssn,*.date_of_birth,credit_score" to enable
APP_URL = "https://bidspoke.trypennie.dev"

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# Secrets (set via `wrangler secret put`):
#   SUPABASE_URL
#   SUPABASE_SECRET_KEY
#   SUPABASE_PUBLISHABLE_KEY
#   API_KEY_MAP            — JSON: { "key": "source_name", ... }
#   CLOUDFLARE_API_TOKEN   — for syncing Worker secrets via CF API
#   CLOUDFLARE_ACCOUNT_ID  — Pennie account: 3e7f907a9c19e51417873e2cce4fbc5c
