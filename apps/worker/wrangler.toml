name = "bidspoke-worker"
main = "src/index.ts"
# Bumped 2024-05-24 -> 2024-09-23 on 2026-06-12 for the nodejs_compat v2 runtime.
# Originally to bundle node-postgres (pg) for the Hyperdrive execution-log writer,
# which was retired (#363); the date stays put because reverting the runtime
# compatibility for the whole Worker is riskier than the dead dependency was.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "3e7f907a9c19e51417873e2cce4fbc5c"

# Smart Placement was evaluated and turned off 2026-04-22. Pennie users are in
# NYC / Florida, and trypennie.my.salesforce.com is in AWS us-east-1 — default
# CF placement at the user's closest PoP (EWR/MIA) is already within ~20ms of
# Salesforce. Smart Placement's extra PoP→PoP relay added latency rather than
# removing it, and its learning phase made measurements unstable across deploys.
# If the user base shifts west of the Mississippi, reconsider.
# [placement]
# mode = "smart"

# Workers KV — workflow definition cache + idempotency
[[kv_namespaces]]
binding = "WORKFLOW_CACHE"
id = "14d18007ddf642f6a5298c8a4a482ebd"
preview_id = "d1541f6fb5424cb0baab17bdf64293d6"

[[kv_namespaces]]
binding = "IDEMPOTENCY"
id = "741da5a97205465eb7f12437f24a2dd2"
preview_id = "6f19293c62f84fedb5d0d418fcd5c6ef"

# Data Store — generic workflow-author KV with TTL (PRD: Data Store node).
# Backs the `data_store` node type. First consumer is the main-flow Submission__c
# → engine UUID cache (7-day TTL), but the namespace is intentionally generic so
# any workflow can read/write key/value pairs.
# Create with: `wrangler kv namespace create SUBMISSIONS` and paste IDs below.
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "a7c2fdab1ab14b1fa277d71f85174ba7"
preview_id = "69efde707c3747068059bfd2d3220986"

# Durable Objects — daily caps + circuit breakers
[[durable_objects.bindings]]
name = "DAILY_CAP"
class_name = "DailyCapObject"

[[durable_objects.bindings]]
name = "CIRCUIT_BREAKER"
class_name = "CircuitBreakerObject"

[[durable_objects.bindings]]
name = "SALESFORCE_BULKHEAD"
class_name = "BulkheadObject"

# Latency Gate bid marks (#488). Strongly consistent, unlike KV, so a confirmation
# landing in another colo still sees the mark.
[[durable_objects.bindings]]
name = "LATENCY_MARK"
class_name = "LatencyMarkObject"

[[migrations]]
tag = "v1"
new_classes = ["DailyCapObject", "CircuitBreakerObject"]

[[migrations]]
tag = "v2"
new_classes = ["BulkheadObject"]

# Alert claims (#1298). One post per alert per cooldown, decided by a strongly
# consistent object, because two cron ticks released together both pass a KV
# cooldown and post twice.
[[durable_objects.bindings]]
name = "ALERT_CLAIM"
class_name = "AlertClaimObject"

[[migrations]]
tag = "v3"
new_classes = ["LatencyMarkObject"]

[[migrations]]
tag = "v4"
new_classes = ["AlertClaimObject"]

# Buyer selection (#1410, milestone 52). Two SQLite backed objects that hold
# SALE state, which does not self heal: the per buyer ledger of reservations and
# outcomes that caps are counted from, and the per lead claim that stops a lead
# being sold twice. A `wrangler rollback` cannot cross the v5 migration; see
# docs/adr/0011-durable-object-migrations-are-one-way.md.
[[durable_objects.bindings]]
name = "BUYER_LEDGER"
class_name = "BuyerLedgerObject"

[[durable_objects.bindings]]
name = "LEAD_SALE"
class_name = "LeadSaleObject"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["BuyerLedgerObject", "LeadSaleObject"]

# Dynamic Workers — code node sandboxing via Workers for Platforms
[[dispatch_namespaces]]
binding = "DYNAMIC_WORKER_LOADER"
namespace = "bidspoke-code-nodes"

# The compare namespace (#1708 part B): shadow runs dispatch their code here,
# and every request a script makes goes to bidspoke-compare-outbound
# (apps/compare-outbound), which refuses it, so a shadow run sends nothing. Its
# bundles are deployed lazily by POST /shadow, by content hash, never on save.
# Deploy Worker creates the namespace if it is missing before deploying.
[[dispatch_namespaces]]
binding = "COMPARE_CODE_LOADER"
namespace = "bidspoke-code-nodes-compare"
outbound = { service = "bidspoke-compare-outbound" }

# Hyperdrive — RETIRED 2026-06-20, code removed #363. The direct-Postgres
# execution-log hot path was provisioned 2026-06-12 to dodge the nightly
# partition-purge schema-cache 503s; the purge is now TRUNCATE-based (migration
# 20260619000001) so it no longer reloads the PostgREST schema cache, removing
# the reason for it. The orphaned CF Hyperdrive config
# d20e883f2ffb4809b9b80d1ff30933c0 can be deleted from the dashboard separately.

# Custom endpoint routing — partner subdomains (e.g. tripoint.trypennie.dev)
# The worker reads the Host header to route *.trypennie.dev requests.
# Route *.trypennie.dev/* → bidspoke-worker is configured in the CF dashboard
# (trypennie.dev zone → Workers Routes) rather than here, because the CI token
# lacks Zone:Workers Routes:Edit permission and wrangler would fail the deploy.

# Public vars
# EVERY VALUE BELOW IS DEPLOY-TIME CONFIGURATION, and only a deploy applies it.
# None of it reaches dist/index.js, so changing one does not move the built
# bundle. Until #1420 the deploy gate compared only that bundle, and a var change
# on its own was therefore skipped: on 2026-09-21 #1404 turned the reachability
# probe's alerts on, Deploy reported success, Deploy Worker was skipped, and the
# probe went on logging mode=observe for an hour. Both the gate and the Deploy
# Drift check now hash this file too (.github/scripts/worker-config-hash.sh), so
# a change here ships and an unshipped one is reported.
#
# The hash ignores comment-only lines, so prose like this does not redeploy the
# live bidding engine, and covers every other line verbatim.
[vars]
SUPABASE_JWKS_URL = "https://xvrmivmpfykwwtriqwpg.supabase.co/auth/v1/.well-known/jwks.json"
PII_REDACTION_FIELDS = ""  # empty = disabled; e.g. "ssn,*.date_of_birth,credit_score" to enable
APP_URL = "https://bidspoke.trypennie.dev"
GITHUB_REPO = "Try-Pennie/bidspoke-workflows"  # target repo for workflow definition backups (PRD 3.2)
# This repository, read hourly to confirm its scheduled workflows are still firing (#805).
# Deliberately separate from GITHUB_REPO above, which is the workflow-backup repo.
GITHUB_CODE_REPO = "Try-Pennie/bidspoke"
# External reachability target for the volume-cliff self-check. Stable bidspoke-owned
# hostname that routes to this worker (GET returns 200). Keep off personal subdomains.
SELF_CHECK_URL = "https://hook.trypennie.dev/"
# Partner reachability probe (#1274). "on" posts to Slack; anything else, a typo
# included, is observe mode, where the probe runs every five minutes and only logs
# what it would have posted. Turned on 2026-09-21 by #1396 after four days observing:
# the control host read blocked on the first tick after its WAF rule existed, no
# would-be alert ever named a real partner, and the control's all-clear fired once
# and settled. A guard in apps/web (partner-probe-alerts-live.test.ts) fails if this
# stops being the exact value the probe compares against. Changed here, by commit,
# so every flip has a record.
PARTNER_PROBE_ALERTS = "on"

# Scheduled cron triggers:
#   "*/5 * * * *"   every 5 minutes: partner reachability probe (#1274). One GET
#                                    to each Achieve host and to the control host
#                                    on our own zone; alerts on a firewall block
#                                    appearing or lifting. Its own trigger so a
#                                    slow partner cannot delay the minute jobs.
#   "0 9 * * *"     daily 09:00 UTC — Achieve export to Snowflake (overnight ET)
#   "0 13 * * *"    daily 13:00 UTC — volume anomaly check (9am EDT; 8am EST in winter)
#   "37 */2 * * *"  every 2h at :37 — lead sightings export to Snowflake. Each run
#                                    drains ~50K rows (per-run platform ceiling) and
#                                    daily inflow is ~83K, so once-daily fell behind;
#                                    12 runs/day keeps well ahead. Its own trigger so
#                                    it gets a full per-run subrequest budget.
#                                    At :37, NOT :00: the top of the hour is the DB's
#                                    busiest window (the strand-recovery pg_cron job,
#                                    at :00/:30 until #1884 and :27/:57 since, runs
#                                    30s+ on the same table; stats refreshes,
#                                    hourly SF sync) and this job's per-statement
#                                    PostgREST budget lost that race every run.
#   (The sightings buffer PURGE is not a Worker cron any more. It ran here on
#    "47 1-23/2" and "47 0-22/2", one table each; since #541 it is the database's
#    own pg_cron job purge-exported-sightings, hourly at :13.)
#   "0 * * * *"     hourly          — sync partner_bid_configs from Salesforce
#   "* * * * *"     every 1 min     — pre-warm KV + outbound connection pool
#                                    (SF token fetch exercises the SF HTTPS pool;
#                                    CF's outbound keep-alive times out at ~60-90s
#                                    so a 1-min cadence keeps it warm)
#   "23 * * * *"    hourly          : execution archive to Snowflake (#871). Deliberately
#                                    at :23: :00 carries the hourly partner sync, :27 and
#                                    :57 the pg_cron strand drain (:00 and :30 until #1884), 08:17 the timeout
#                                    audit (08:15 until #1884), and :37 the sightings export.
#                                    This job reads execution_steps in bulk, which is the
#                                    same table the timeout audit's percentile queries hit.
#   "*/15 * * * *" every 15 min : fill each Tripoint win with what the lead was
#                                    worth, read back from Salesforce (#354).
#                                    Frequent NOT because the work is urgent but
#                                    because of retention: bid rows reach
#                                    Snowflake about 57 minutes after the bid
#                                    (measured 2026-09-04) and the purge then
#                                    deletes the exported row, so a value written
#                                    after export never reaches the warehouse and
#                                    is destroyed. A daily job would fill almost
#                                    nothing anybody could query. About 26 rows
#                                    and one Salesforce query per run.

# The kept Engine canvas scripts as text (#1472). apps/worker/src/engine/scripts/
# engine-bidding/*.js are byte for byte what is pasted into the Engine Bidding
# Workflow's code nodes (liberty1-click/*.js are the Liberty1 click
# workflow's, #1545, and lead-economy/*.js Lead Economy's, #2089): script
# bodies, not modules. The hourly drift check
# imports them to compare against the canvas mirror, so they are bundled as
# strings. The same import is served by the vitest plugin in vitest.config.ts.
[[rules]]
type = "Text"
globs = ["**/engine-bidding/*.js", "**/liberty1-click/*.js", "**/lead-economy/*.js"]
fallthrough = true

[triggers]
crons = ["0 9 * * *", "17 8 * * *", "0 13 * * *", "37 */2 * * *", "0 * * * *", "23 * * * *", "*/15 * * * *", "*/5 * * * *", "* * * * *"]

# CPU ceiling, stated explicitly rather than inherited (#871).
#
# 30000 ms is the platform default, so this RAISES nothing: it is here so the
# number the archive's per-run hour cap is derived from is visible in the same
# file as the cron that runs it. Raising it would apply to every invocation of
# this Worker including the request path, where a runaway handler would then burn
# five minutes of CPU instead of being killed at thirty seconds, and the archive
# does not need it: A0 measured 0.8 ms of CPU per bundle, so an hour of ~4,375
# executions is about 3.5 s and the cap in execution-archive.ts keeps a drain
# inside this ceiling instead.
[limits]
cpu_ms = 30000
# "17 8 * * *" is the timeout audit, deliberately off peak (#251). Its grouped
# percentile queries are the heaviest thing we run against execution_steps, and
# 08:00 UTC is the quietest hour of the day: 9,541 executions over 7 days to
# 13:00's 31,617 and 17:00's 50,536. 08:17 is a minute no other job starts in
# (#1884): no other worker cron (the rest run on multiples of five, at :23 and at
# :37) and no pg_cron job starts then. It was :15 until 2026-10-08, the same
# minute both rollup refreshes started, and lead requests slowed to 8.5 s. The
# audit also runs its percentile queries two at a time (lib/timeout-audit.ts).
# apps/web/src/lib/__tests__/rollup-refresh-collision-guard.test.ts fails when a
# daily worker cron shares its start minute with any pg_cron job.

# R2 bucket (Logpush destination, Phase 3) — configured via CF dashboard/API, NOT via wrangler binding.
# Logpush writes directly to R2 at the CF infrastructure level; the Worker does not read/write R2.
# To enable: create bucket "bidspoke-logs" in CF dashboard, then create a Logpush job:
#   curl -X POST "https://api.cloudflare.com/client/v4/accounts/{account_id}/logpush/jobs" \
#     -H "Authorization: Bearer {token}" \
#     -d '{"name":"bidspoke-worker-logs","destination_conf":"r2://bidspoke-logs/logs/{DATE}?account-id={ACCOUNT}&access-key-id={KEY}&secret-access-key={SECRET}",
#          "dataset":"workers_trace_events","logpull_options":"fields=Event,EventTimestampMs,Outcome,Logs,ScriptName&timestamps=unixnano"}'
# After confirming Logpush is active, set logpush_active = 'true' in Supabase app_config.

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# Tail consumer — receives a TraceItem per request with true cpuTime,
# adds the main-Worker cost slice onto workflow_executions.cost_usd.
# See apps/worker-tail for the consumer code.
[[tail_consumers]]
service = "bidspoke-worker-tail"

# Secrets (set via `wrangler secret put`):
#   SUPABASE_URL
#   SUPABASE_SECRET_KEY
#   SUPABASE_PUBLISHABLE_KEY
#   API_KEY_MAP            — JSON: { "key": "source_name", ... }
#   CLOUDFLARE_API_TOKEN   — for syncing Worker secrets via CF API
#   CLOUDFLARE_ACCOUNT_ID  — Pennie account: 3e7f907a9c19e51417873e2cce4fbc5c
