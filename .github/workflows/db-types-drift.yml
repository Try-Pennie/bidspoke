name: DB Types Drift

# Authoritative check that the committed Supabase types match the live schema.
# Regenerates apps/worker/src/types/database.ts from production and fails if it
# differs from what's committed — catching any schema change that landed without
# a types regen (the typed client would otherwise drift from reality and mask
# new columns/bugs). Runs nightly; trigger manually via the Actions tab too.

on:
  schedule:
    - cron: '0 8 * * *' # daily 08:00 UTC
  workflow_dispatch:

jobs:
  drift:
    name: Generated DB types match live schema
    runs-on: ubuntu-latest
    env:
      # Set this repo secret to an incoming-webhook URL to route failures to Slack
      # (#324). Absent -> the alert step no-ops; the job still fails as usual.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v6

      # Pinned (#323): `latest` installs whatever CLI shipped that night, a
      # non-reproducible source of spurious drift failures if the generator's
      # formatting changes. Bump deliberately and keep gen-db-types.sh in sync.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.107.0

      - name: Regenerate types from the live schema
        working-directory: apps/worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: bash scripts/gen-db-types.sh

      - name: Fail if the committed types drifted
        run: |
          set -euo pipefail
          if ! git diff --exit-code apps/worker/src/types/database.ts; then
            echo "::error::Generated Supabase types are stale vs the live schema. Run 'pnpm --filter worker db:types' and commit the result."
            exit 1
          fi
          echo "DB types are in sync with the live schema."

      # Route a real drift/failure to Slack (#324) so schema changes that outran a
      # types regen are noticed fast, not just buried in Actions email. No-ops when
      # SLACK_WEBHOOK_URL is unset.
      - name: Alert Slack on failure
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          # Build the message with printf (real newlines) then let jq emit valid
          # JSON — hand-escaping newlines into the JSON string is error-prone.
          TEXT=$(printf '*DB Types Drift check failed* (`%s`)\n\nThe committed Supabase types no longer match the live database schema. Usually a database migration changed the schema but the generated types were not refreshed, so the typed client is out of date.\n\n*How to fix:* run `pnpm --filter worker db:types`, commit the updated `apps/worker/src/types/database.ts`, then push. If the schema did not actually change, the type generator may have had a transient error, so just re-run this check.\n\n<%s/%s/actions/runs/%s|Open the failed run>' \
            "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg text "$TEXT" '{text: $text}')"
