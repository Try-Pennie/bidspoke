# Auto-merges only the routine, low-risk Dependabot PRs once CI passes.
#
# This repo is on GitHub's free plan for a private repo, so branch protection
# and repository rulesets aren't available, meaning GitHub's built-in
# "auto-merge" (gh pr merge --auto) has nothing to actually wait on and would
# merge immediately instead of waiting for CI. This workflow instead triggers
# after the CI workflow finishes and only merges once it has actually
# succeeded.
#
# What counts as safe to merge automatically:
#   - The grouped npm "minor-and-patch" PR (dependabot.yml groups every
#     non-major npm update into one PR per week; any ungrouped npm PR is by
#     definition a major-version bump, since minor/patch always lands in the
#     group).
#   - Any github-actions ecosystem PR (these only affect the CI pipeline
#     itself, not the deployed app, and a bad bump fails CI loudly rather
#     than shipping broken production code).
# Everything else (major-version app dependency bumps) is left for manual
# review.
name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # The branch prefix is a CHEAP PRE-FILTER, not the decision (#1065).
    #
    # This workflow fires on every completed CI run, and 302 of them in 30 days
    # were human pull requests. Each checked out the repo and called `gh` twice
    # before the decision script could say "not eligible", and a job bills a
    # minimum of one minute however little it does: roughly 180 billed minutes a
    # month to reach an answer the event payload already carried.
    #
    # `head_branch` is on the workflow_run payload, so skipping here costs
    # nothing and changes nothing on the Dependabot runs. The allowlist that
    # actually decides stays in .github/scripts/dependabot-automerge-decision.sh,
    # which is unit tested and checks the AUTHOR as well as the branch. That
    # matters: a branch name is attacker-choosable and this prefix alone would
    # not be a safe basis for merging anything (the author spelling flipping
    # from dependabot[bot] to app/dependabot is exactly why that script exists).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    # measured max 6s, plus headroom. Bounds a HANG, not slowness (#1062).
    timeout-minutes: 5
    steps:
      # Checks out the DEFAULT branch (main), not the PR head, because this job
      # is triggered by workflow_run. That is exactly what we want: the
      # merge-decision script runs from trusted main, never from the untrusted
      # PR branch, and it gives the script below a stable local path.
      - uses: actions/checkout@v7

      - name: Find the PR for this CI run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '.[0].number // empty')
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Merge if it's a routine Dependabot PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        # The author + branch allowlist lives in a unit-tested script
        # (.github/scripts/dependabot-automerge-decision.sh) so a gh CLI change
        # can't silently break it again: the author login flipped from
        # "dependabot[bot]" to "app/dependabot" and this guard skipped every
        # routine PR until 2026-07-24. gh needs --repo explicitly even with a
        # checkout, since the checked-out ref is main, not the PR.
        run: |
          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq .author.login)
          BRANCH=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq .headRefName)

          DECISION=$(bash .github/scripts/dependabot-automerge-decision.sh "$AUTHOR" "$BRANCH")

          if [ "$DECISION" = "merge" ]; then
            echo "Merging routine Dependabot PR #$PR_NUMBER ($BRANCH)"
            gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
          else
            echo "PR #$PR_NUMBER (author=$AUTHOR, branch=$BRANCH) is not in the auto-merge allowlist, leaving for manual review."
          fi
