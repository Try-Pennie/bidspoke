name: Deploy

on:
  push:
    branches: [main]
  # A merge made with GITHUB_TOKEN (the Dependabot auto-merge) starts no push
  # run: GitHub starts no workflow from a push made by that token, so before
  # #1761 every auto-merge left main undeployed until a human merge happened to
  # follow. A workflow_dispatch sent with GITHUB_TOKEN IS the documented
  # exception that starts a run, so the auto-merge dispatches this, and a person
  # repairing a stranded target starts it here (Actions, Deploy, Run workflow).
  #
  # A dispatched run has no previous push, so two things that read the push are
  # resolved per event by tested scripts: which targets deploy (all of them,
  # deploy-targets-decision.sh) and what the money gate compares against
  # (money-gate-base.sh). Every DEPLOYED_SHA stamp reads github.sha, which on a
  # dispatch is main's tip when it was started, so the stamps stay right.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Who or what started this run, for the run list.'
        required: false
        default: 'manual'
      money_gate_base:
        description: 'Commit the money gate compares the engine against. Leave empty to use the commit the live worker reports.'
        required: false
        default: ''

# Dispatched runs queue behind each other; push runs never wait (#1761).
#
# Batched Dependabot auto-merges each dispatch a Deploy at main's tip a few
# minutes apart (#700 and #701 merged 2.5 minutes apart), each deploys every
# target, and a Deploy takes about 6 minutes, so two running at once could finish
# in the wrong order and leave the OLDER commit on Pages or the tail worker. One
# group for every dispatch makes them run one at a time. cancel-in-progress is
# false because a cancelled run can stop part way through a deploy (L671).
#
# GitHub keeps one PENDING run per group and replaces it with a newer one. For a
# dispatch that loses nothing: the newer dispatch deploys every target at a newer
# tip. A push run deploys only what its own diff touched (#1514), so a replaced
# push would take its targets with it, and that is why each push run gets a group
# of its own (its run id) and keeps the behaviour it had before #1761. A push run
# can still overlap a dispatched one; drift reports the result if it ever lands
# in the wrong order.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'deploy-dispatched-main' || format('deploy-push-{0}', github.run_id) }}
  cancel-in-progress: false

# supabase/setup-cli@v3 still ships Node.js 20, which GitHub deprecated.
# Force Node 24 across all JS actions until upstream publishes a v24-native release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # VERIFY IS FOUR PARALLEL JOBS BEHIND A FAN-IN (#1061)
  #
  # Measured over the four deploys from 2026-08-23 to 2026-08-29: Verify took
  # 216 to 249s with every step in a line (typecheck 41s, lint 38s, tests 123s,
  # docs 1s, Supabase CLI plus migration check 14s). Every other job here lists
  # `verify` in `needs`, so Deploy Pages and Deploy Worker could not start until
  # all of it finished. Merge-to-live was about 6.5 minutes for a web change.
  #
  # THE JOB ID `verify` IS LOAD-BEARING and stays exactly where it was. Five
  # jobs name it in `needs`, and two re-assert `needs.verify.result == 'success'`
  # by hand because their `always()` discards the implicit all-needs-succeeded
  # rule. The fan-in below keeps that id and that contract.
  #
  # It runs `if: always()` and checks each leg by hand rather than relying on
  # `needs` alone. Without `always()` a failed leg would leave `verify` SKIPPED,
  # which still blocks every downstream job correctly but reports as a grey
  # check nobody reads; failing loudly names the leg instead. The hand check is
  # then mandatory: `always()` is exactly what throws away the rule that would
  # otherwise have failed it (the same trap deploy-worker documents below).
  #
  # A leg accidentally left out of the fan-in's `needs` would run, gate nothing,
  # and let a red suite deploy. That cannot happen silently: a test reads this
  # file and requires the fan-in to need every job in it that runs a test,
  # typecheck or lint command.
  verify-static:
    name: Verify (typecheck + lint)
    runs-on: ubuntu-latest
    # measured 41s + 38s + setup, plus headroom. Bounds a HANG (#1062).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  verify-worker:
    name: Verify (worker tests)
    runs-on: ubuntu-latest
    # 10 before the money gate (#1704) added a second install and two replays.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test shared packages
        run: |
          pnpm --filter @bidspoke/references test
          pnpm --filter @bidspoke/uuidv7 test
          pnpm --filter @bidspoke/script-hygiene test
          pnpm --filter @bidspoke/buyer-profile test
          pnpm --filter @bidspoke/node-types test
          pnpm --filter @bidspoke/porting-evidence test
          pnpm --filter @bidspoke/workflow-definition test
          pnpm --filter compare-outbound test
          pnpm --filter ops-outbound test
          pnpm --filter worker-tail test

      # `test:unit`, not `test` (#967). The worker's `test` script also boots the
      # web vitest project to run the worker guards, which the web leg below
      # runs anyway in this same deploy. That duplication was part of the 123s.
      - name: Test worker
        run: pnpm --filter worker test:unit

      # The Workers test project (#1410): the SQLite backed Durable Object suites
      # in workerd. See the same step in ci.yml.
      - name: Test worker Durable Objects
        run: pnpm --filter worker test:do

      # The money gate (#1704) as a second line: the engine main was at before
      # this push against the engine it is at now, on every push, whatever the
      # pull request's own run did. Not keyed on the worker_artifact decision,
      # which fails open and would also make a needs cycle with verify. See the
      # money-gate job in ci.yml and apps/worker/money-gate/README.md.
      #
      # A dispatched run has no `github.event.before` (#1761). The base is then
      # the `money_gate_base` input, or the commit the live worker reports, and a
      # run that can find neither refuses by name rather than comparing against
      # nothing. money-gate-base.sh holds that rule and is tested.
      - name: Money gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.money_gate_base }}
          WORKER_URL: ${{ vars.NEXT_PUBLIC_WORKER_URL }}
        run: |
          set -uo pipefail
          MONEY_GATE_BASE=$(bash .github/scripts/money-gate-base.sh "$EVENT_NAME" "$PUSH_BEFORE" "$INPUT_BASE") || exit 1
          bash .github/scripts/money-gate.sh "$MONEY_GATE_BASE"

  verify-web:
    name: Verify (web tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test web
        run: pnpm --filter web test

  verify-release:
    name: Verify (docs + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Docs are published to the public /docs site by sync-docs.mjs during
      # pages:build; this gate fails the build on broken relative links,
      # moved/renamed pages, or stale llms.txt entries before they go live.
      - name: Docs integrity (sync + link check)
        run: |
          pnpm --filter=web docs:sync
          pnpm --filter=web docs:check

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned (not `latest`) so the install doesn't resolve the latest
          # release via the GitHub API, which intermittently rate-limits and
          # fails the whole deploy (#333). Keep in sync with db-types-drift.yml.
          version: 2.107.0

      # The repository's migrations against the bidding database's, through the
      # script Deploy Ops Worker also runs for the ops database (#1829).
      - name: Check for unapplied migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: bash .github/scripts/check-unapplied-migrations.sh "$SUPABASE_PROJECT_ID" .

  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Pure fan-in: no checkout, no install, nothing to hang on.
    timeout-minutes: 5
    needs: [verify-static, verify-worker, verify-web, verify-release]
    if: always()
    steps:
      - name: Require every verification leg to have passed
        env:
          STATIC: ${{ needs.verify-static.result }}
          WORKER: ${{ needs.verify-worker.result }}
          WEB: ${{ needs.verify-web.result }}
          RELEASE: ${{ needs.verify-release.result }}
        run: |
          set -uo pipefail
          failed=""
          # Anything that is not an outright success blocks the deploy:
          # 'failure', 'cancelled' and 'skipped' all mean this leg did not
          # verify anything, and a leg that never ran must never read as a pass
          # (L98).
          [ "$STATIC" = "success" ] || failed="${failed} typecheck+lint($STATIC)"
          [ "$WORKER" = "success" ] || failed="${failed} worker-tests($WORKER)"
          [ "$WEB" = "success" ] || failed="${failed} web-tests($WEB)"
          [ "$RELEASE" = "success" ] || failed="${failed} docs+migrations($RELEASE)"
          if [ -n "$failed" ]; then
            echo "::error::Verification failed, so nothing deploys:${failed}"
            exit 1
          fi
          echo "All verification legs passed."


  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # measured max 9s over 6 runs, plus headroom. Bounds a HANG, not slowness (#1062).
    timeout-minutes: 5
    # Every output comes from the targets step, never straight from the filter
    # (#1761). The filter compares a push with the commit before it, and on a
    # dispatched run it would compare only HEAD with HEAD^, so a run started to
    # repair a stranded target could deploy nothing on a docs only tip.
    outputs:
      worker: ${{ steps.targets.outputs.worker }}
      worker_tail: ${{ steps.targets.outputs.worker_tail }}
      pages: ${{ steps.targets.outputs.pages }}
      compare_outbound: ${{ steps.targets.outputs.compare_outbound }}
      ops_outbound: ${{ steps.targets.outputs.ops_outbound }}
      ops_worker: ${{ steps.targets.outputs.ops_worker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          # `packages/**` is in EVERY target, deliberately as a superset rather
          # than per-consumer (#869). Shared code is imported by more than one app,
          # and a filter derived from real dependency edges would silently miss a
          # package newly imported by an app whose filter nobody revisited. Without
          # it, a commit touching only shared code deploys nowhere AND all three
          # drift checks report every target up to date, because they ask git about
          # the same paths: the guard built to catch a stranded deploy would be
          # blind to this one by construction (#327, #802, #804).
          #
          # Over-triggering costs nothing: Deploy Worker compares built bundle
          # bytes and skips when they match, and a redundant Pages deploy is free.
          # Guarded by
          # apps/web/src/lib/__tests__/deploy-covers-shared-packages.test.ts.
          filters: |
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            worker_tail:
              - 'apps/worker-tail/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            pages:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            compare_outbound:
              - 'apps/compare-outbound/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            # secret-lists.ts holds OPS_WORKER_DEPLOYED, the switch that lets this
            # target deploy at all (deploy-targets-decision.sh), so flipping it
            # deploys the ops outbound Worker in the same push (#1709).
            ops_outbound:
              - 'apps/ops-outbound/**'
              - 'apps/worker/src/lib/secret-lists.ts'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            # Deploy Ops Worker is where an unapplied ops migration is refused
            # (#1829), so a push carrying only an ops migration reaches it too.
            ops_database:
              - 'supabase-ops/**'

      # On a push, the filter's answer. On a dispatched run (or an event this
      # does not know), every target, because there is no previous push to diff
      # against. Over deploying is safe: Deploy Worker's artifact gate still
      # skips a byte identical bundle.
      - name: Decide which targets deploy
        id: targets
        # REF because a Deploy dispatched from a branch would otherwise
        # `wrangler deploy` that branch to production (the dispatch has a branch
        # picker). The script deploys nothing off main and fails this job.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          WORKER: ${{ steps.filter.outputs.worker }}
          WORKER_TAIL: ${{ steps.filter.outputs.worker_tail }}
          PAGES: ${{ steps.filter.outputs.pages }}
          COMPARE_OUTBOUND: ${{ steps.filter.outputs.compare_outbound }}
          OPS_OUTBOUND: ${{ steps.filter.outputs.ops_outbound }}
          OPS_DATABASE: ${{ steps.filter.outputs.ops_database }}
        run: bash .github/scripts/deploy-targets-decision.sh "$EVENT_NAME" "$REF" "$WORKER" "$WORKER_TAIL" "$PAGES" "$COMPARE_OUTBOUND" "$OPS_OUTBOUND" "$OPS_DATABASE" >> "$GITHUB_OUTPUT"

  deploy-worker-tail:
    name: Deploy Worker Tail
    runs-on: ubuntu-latest
    # conditional and rarely run; sized like Deploy Worker, plus headroom. Bounds a HANG, not slowness (#1062).
    timeout-minutes: 10
    needs: [verify, changes]
    if: needs.changes.outputs.worker_tail == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `exec`, not `run deploy -- --var`. pnpm forwards a bare `--` verbatim,
      # wrangler reads it as end of options and silently discards every flag
      # after it, and the deploy still exits 0. That is #327: the engine worker
      # answered `version: "unknown"` for months and the drift check it fed
      # skipped every hour. A test asserts this line never regains that shape.
      - name: Deploy Worker Tail
        run: pnpm --filter=worker-tail exec wrangler deploy --var DEPLOYED_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # The compare namespace's outbound Worker (#1708 part B): every request a code
  # bundle makes in the bidspoke-code-nodes-compare namespace, where shadow runs
  # dispatch, is routed to it and refused, so a shadow run sends nothing. It has
  # no route or workers.dev address, so it is reached only as that outbound
  # service. Its own app and leg, like the tail worker, so a change to it ships
  # on its own path rather than waiting on the engine's artifact gate.
  deploy-compare-outbound:
    name: Deploy Compare Outbound
    runs-on: ubuntu-latest
    # conditional and rarely run; sized like Deploy Worker Tail, plus headroom. Bounds a HANG, not slowness (#1062).
    timeout-minutes: 10
    needs: [verify, changes]
    if: needs.changes.outputs.compare_outbound == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `exec`, not `run deploy -- --var`, for the reason on Deploy Worker Tail.
      - name: Deploy Compare Outbound
        run: pnpm --filter=compare-outbound exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # The ops namespace's outbound Worker (#1709 part 3): every request a code
  # bundle makes in the bidspoke-code-nodes-ops namespace is routed to it and
  # refused until Phase 2 defines what ops code may reach. Wired like Deploy
  # Compare Outbound, and held off until the ops lane goes live: the decision
  # script answers false for it while OPS_WORKER_DEPLOYED is false, on every
  # event, so merging ops code creates no Cloudflare resource before part 4.
  deploy-ops-outbound:
    name: Deploy Ops Outbound
    runs-on: ubuntu-latest
    # conditional and rarely run; sized like Deploy Compare Outbound, plus headroom. Bounds a HANG, not slowness (#1062).
    timeout-minutes: 10
    needs: [verify, changes]
    if: needs.changes.outputs.ops_outbound == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `exec`, not `run deploy -- --var`, for the reason on Deploy Worker Tail.
      - name: Deploy Ops Outbound
        run: pnpm --filter=ops-outbound exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # The ops Worker, bidspoke-worker-ops (#1709 part 4): the Pipedream move's own
  # Worker, built from apps/worker with wrangler.ops.toml, serving
  # ops.trypennie.dev/porting/*. It deploys whenever the worker sources do, once
  # OPS_WORKER_DEPLOYED is true (deploy-targets-decision.sh), after its outbound
  # Worker: the ops code namespace routes every request a bundle makes there, so
  # the namespace step refuses by name if that Worker is missing. always() lets a
  # skipped Deploy Ops Outbound leg pass (a push that did not touch it), and the
  # namespace step is what stops a run whose outbound Worker does not exist. The
  # last step proves the host is answered by this Worker, with its lane and its
  # master secret, and fails the run if it is not.
  deploy-ops-worker:
    name: Deploy Ops Worker
    runs-on: ubuntu-latest
    # a wrangler deploy (Deploy Worker's measured max 39s) plus the proof's
    # bounded wait (12 attempts, 10s apart), plus the CLI install and migration
    # check (14s measured in Verify), plus headroom. Bounds a HANG, not slowness (#1062).
    timeout-minutes: 10
    needs: [verify, changes, deploy-ops-outbound]
    if: |
      always()
      && needs.verify.result == 'success'
      && needs.changes.outputs.ops_worker == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned to the version Verify installs (a test holds the two equal).
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.107.0

      # Before anything deploys (#1829): ops code that reads a table an unapplied
      # migration creates would fail on its first run. Its own job rather than
      # Verify, so an ops migration never holds up a bidding deploy. The ops
      # project's CLI login role is separate from the bidding one's, so the two
      # checks never contend over it (#392).
      - name: Check for unapplied ops migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_OPS_PROJECT_ID: ${{ vars.SUPABASE_OPS_PROJECT_ID }}
        run: bash .github/scripts/check-unapplied-migrations.sh "$SUPABASE_OPS_PROJECT_ID" supabase-ops

      - name: Ensure the ops namespace exists
        run: bash .github/scripts/ensure-compare-namespace.sh 3e7f907a9c19e51417873e2cce4fbc5c bidspoke-code-nodes-ops bidspoke-ops-outbound
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # `exec`, not `run deploy -- --var`, for the reason on Deploy Worker.
      - name: Deploy Ops Worker
        run: pnpm --filter=worker exec wrangler deploy --config wrangler.ops.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Prove ops.trypennie.dev is the ops Worker
        run: bash .github/scripts/prove-ops-host.sh https://ops.trypennie.dev/porting/capture/p_deployproof

  worker_artifact:
    name: Worker artifact changed
    runs-on: ubuntu-latest
    # measured max 43s over 3 runs, and it builds twice, plus headroom. Bounds a HANG, not slowness (#1062).
    timeout-minutes: 10
    needs: [verify, changes]
    if: needs.changes.outputs.worker == 'true'
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    env:
      WORKER_URL: ${{ vars.NEXT_PUBLIC_WORKER_URL }}
    # The paths filter above lists pnpm-lock.yaml and package.json under `worker`,
    # so a web-only dependency bump reaches Deploy Worker with no worker source
    # change (confirmed live on 2026-07-30 merging #706, a test-only
    # devDependency: 15 of the 21 commits touching pnpm-lock.yaml in the last 90
    # days did not touch apps/worker/src at all).
    #
    # Narrowing the filter would only be a heuristic, because pnpm can genuinely
    # re-resolve a shared transitive dependency and move the worker bundle, and a
    # filter cannot tell. So compare the ARTIFACT: build at the live worker's
    # reported commit and at HEAD, and deploy only when the bytes differ
    # (LESSONS L40). #725 measured on ubuntu-latest that two clean builds of one
    # commit are byte identical AND that a reachable source change moves the hash.
    #
    # This job must never be the reason a real change fails to ship, so every
    # step tolerates failure and the decision falls through to `deploy`.
    steps:
      # Two SEPARATE checkouts, each with its own node_modules. #725 proved
      # same-input determinism on one machine but explicitly did NOT cover
      # installing two different dependency sets one after another, which is what
      # this job does. Separate working directories remove the question. The pnpm
      # store is content-addressed, so sharing it is safe; the node_modules trees
      # are what must not be reused.
      - name: Check out HEAD
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: head

      - name: Read the live worker's deployed commit
        id: live
        run: |
          set -uo pipefail
          LIVE_SHA=$(curl -fsS --max-time 20 "$WORKER_URL/" | jq -r '.version // "unknown"') || LIVE_SHA=""
          echo "sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$LIVE_SHA" ] && [ "$LIVE_SHA" != "unknown" ] \
             && git -C head cat-file -e "${LIVE_SHA}^{commit}" 2>/dev/null; then
            echo "in_history=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Live commit '${LIVE_SHA}' is unusable for comparison, so the deploy will go ahead."
            echo "in_history=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the live commit
        if: steps.live.outputs.in_history == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.live.outputs.sha }}
          path: live

      # The version comes from package.json `packageManager` (#1677). This job
      # has no checkout at the workspace root, so point at HEAD's copy. HEAD, not
      # live: a live commit may predate the declaration, and both builds should
      # be made by the same pnpm so the comparison measures the code.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: head/package.json

      # Deliberately no `cache: 'pnpm'`: a cache shared between the two installs
      # is the contamination route #725 flagged as unproven, and correctness here
      # is worth more than the cache.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build at HEAD
        id: head_build
        working-directory: head
        run: |
          set -uo pipefail
          if pnpm install --frozen-lockfile && pnpm --filter=worker run build; then
            echo "hash=$(sha256sum apps/worker/dist/index.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "config_hash=$(bash .github/scripts/worker-config-hash.sh)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HEAD build failed inside the artifact gate, so the deploy will go ahead unconditionally."
          fi

      - name: Build at the live commit
        id: live_build
        if: steps.live.outputs.in_history == 'true'
        working-directory: live
        run: |
          set -uo pipefail
          if pnpm install --frozen-lockfile && pnpm --filter=worker run build; then
            echo "hash=$(sha256sum apps/worker/dist/index.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            # The HEAD copy of the hashing script deliberately, so both sides are
            # measured the same way even when the script itself changed (L398).
            echo "config_hash=$(bash ../head/.github/scripts/worker-config-hash.sh)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Build at the live commit failed inside the artifact gate, so the deploy will go ahead unconditionally."
          fi

      # Hashes dist/index.js rather than the whole outdir: the sibling sourcemap
      # embeds sourceRoot, which equals the --outdir path, so hashing the
      # directory would measure the harness rather than the artifact (#725).
      #
      # The bundle is only half of it (#1420). wrangler.toml's [vars], crons,
      # limits and bindings are applied BY the deploy and appear nowhere in the
      # bundle, so they are hashed separately and a skip needs both unchanged.
      - name: Decide whether the artifact moved
        id: decide
        run: |
          set -uo pipefail
          DECISION=$(bash head/.github/scripts/worker-artifact-decision.sh \
            "${{ steps.live.outputs.sha }}" \
            "${{ steps.live.outputs.in_history }}" \
            "${{ steps.head_build.outputs.hash }}" \
            "${{ steps.live_build.outputs.hash }}" \
            "${{ steps.head_build.outputs.config_hash }}" \
            "${{ steps.live_build.outputs.config_hash }}")
          if [ "$DECISION" = "skip" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    # measured max 39s, plus headroom. Bounds a HANG, not slowness (#1062).
    timeout-minutes: 10
    # deploy-compare-outbound first (#1708 part B): the engine binds the compare
    # namespace with that Worker as its outbound service, so in a fresh account it
    # has to exist before the engine deploys. always() below lets that leg be
    # skipped, and also lets it FAIL, since its result is never checked. A failed
    # leg is still safe: the "Ensure the compare namespace exists" step below
    # refuses by name when the outbound Worker is missing, and an older outbound
    # Worker left in place still refuses every request.
    needs: [verify, changes, worker_artifact, deploy-compare-outbound]
    # Skips ONLY on an explicit `false`, meaning the gate positively decided the
    # built artifact is byte identical to what is already live. Any other state,
    # including the gate job crashing outright, deploys.
    #
    # The naive `changed == 'true'` is wrong in the direction that hurts: a failed
    # gate job leaves that output empty, which would silently skip the deploy and
    # strand the engine behind a green pipeline, exactly the defect the Deploy
    # Drift check (#327) exists to catch.
    #
    # always() is what allows that fall-through, but it also discards the implicit
    # "all needs succeeded" rule, so Verify is re-asserted by hand. Without that,
    # a red test suite would deploy.
    if: |
      always()
      && needs.verify.result == 'success'
      && needs.changes.outputs.worker == 'true'
      && needs.worker_artifact.outputs.changed != 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The compare namespace the engine binds (#1708 part B), created when it is
      # missing, and its outbound Worker, which must exist, both before wrangler
      # deploy, which refuses a binding to a namespace that does not exist.
      - name: Ensure the compare namespace exists
        run: bash .github/scripts/ensure-compare-namespace.sh 3e7f907a9c19e51417873e2cce4fbc5c bidspoke-code-nodes-compare bidspoke-compare-outbound
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        # Stamp the deployed commit so GET / can report it and the Deploy Drift
        # check (#327) can detect a committed-but-never-deployed worker.
        #
        # `exec wrangler` rather than `run deploy -- ...`: pnpm forwards a bare `--`
        # verbatim, so the script form reached wrangler as `deploy -- --var K:V`,
        # where `--` ends option parsing and the flag became ignored positional
        # junk. wrangler still exited 0, so every deploy since #327 reported
        # success while leaving the worker unstamped and GET / answering
        # "unknown". Guarded by deploy-sha-wiring.test.ts.
        run: pnpm --filter=worker exec wrangler deploy --var DEPLOYED_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    # measured max 135s over 2 runs to build and upload, plus up to 300s for the
    # propagation sampler below to wait on a route that never flips, plus
    # headroom. Bounds a HANG, not slowness (#1062). A test derives the sum.
    timeout-minutes: 10
    # After the Worker (#2132). A partners page opened before a Worker change
    # that refuses its saves is told to reload, which only helps if the page it
    # reloads into is the new one, so the site never goes live ahead of a Worker
    # deploy that failed. always() lets a skipped Worker deploy (a web only
    # change) through, and then Verify has to be re-asserted by hand, exactly as
    # in deploy-worker. deploy-pages-follows-worker.test.ts evaluates this.
    needs: [verify, changes, deploy-worker]
    if: always() && needs.changes.outputs.pages == 'true' && needs.verify.result == 'success' && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same Next.js build cache the PR jobs use (#974, the deploy half of #970).
      # This build ran from cold on every merge, and it sits on the merged-to-live
      # wait that is actually felt: the one between pressing merge and being able
      # to check production.
      #
      # Keyed on the lockfile plus a hash of the web sources, so a real source
      # change always misses and rebuilds; restore-keys then seeds that rebuild
      # from the nearest previous cache. A restored cache can only make the build
      # faster or fail loudly, never produce a silently different artifact,
      # because the key moves whenever the inputs do.
      - name: Cache the Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/next.config.*', 'apps/web/tailwind.config.*', 'apps/web/postcss.config.*') }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-build-${{ runner.os }}-

      - name: Build (next-on-pages)
        run: pnpm --filter=web pages:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WORKER_URL: ${{ vars.NEXT_PUBLIC_WORKER_URL }}
          # The site's half of the stranded-deploy stamp (#804). NEXT_PUBLIC_* is
          # inlined at compile time, so it has to be here, on the BUILD, and not
          # on the upload step below: setting it there would look wired, stay
          # green, and ship a site that renders the placeholder forever. That is
          # the silent half of #327, which is why a test asserts which step owns
          # this line.
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter=worker exec wrangler pages deploy ${{ github.workspace }}/apps/web/.vercel/output/static --project-name ${{ vars.CF_PAGES_PROJECT_NAME }} --commit-dirty=true --commit-message="${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3e7f907a9c19e51417873e2cce4fbc5c

      # Measure how long the site takes to serve this commit on each sampled
      # route (#901). A Pages deploy propagates per route AFTER the upload, and
      # Deploy Drift excuses a route that is behind while the upload is younger
      # than a grace period. That grace has to be set from several measured
      # deploys, not a guess, so every Pages deploy logs its own readings here
      # (`pages-propagation:` lines, also in the step summary). Right after the
      # upload step so its clock starts at the instant the drift check anchors
      # its age on. It is a measurement, never a gate: it cannot fail the deploy.
      - name: Watch the routes flip to this commit
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo "pages-propagation: the SITE_URL repository variable is empty, so propagation was not measured"
            exit 0
          fi
          . .github/scripts/pages-routes.sh
          # shellcheck disable=SC2086
          bash .github/scripts/pages-propagation-sample.sh "$SITE_URL" "$GITHUB_SHA" 300 15 $PAGES_ROUTES

  # Whether the partners page has followed the Worker (#2132). The sampler above
  # is a measurement that never gates and reads public routes only, by a
  # recorded decision, so this is its own job: it signs in as the e2e user,
  # fetches /partners the way a person does (no cache busting, the same reason
  # the sampler gives) and reads the commit stamp with pages-commit-from-html.sh.
  # Until the page follows, an open partners page refuses saves with a reload
  # message, so a page that has not followed within the budget fails this job,
  # and each other outcome (could not sign in, no stamp, no password) says so by
  # name. BUDGET_SECONDS: the sampler's slowest reading over 8 deploys from
  # 2026-10-13 to 15 was 18 s; 180 s is ten times that. The timeout is derived
  # from it by deploy-pages-follows-worker.test.ts.
  partners-page-follows:
    name: Partners page follows the Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-pages]
    if: always() && needs.deploy-pages.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Read the commit the signed in partners page serves
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ vars.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          BUDGET_SECONDS: '180'
          INTERVAL_SECONDS: '15'
        run: node --experimental-strip-types .github/scripts/partners-page-commit.mjs

  # Note: deploy failures are not Slack-alerted (reverted #328) — GitHub's
  # default Actions failure email already covers them, and the Slack page was
  # redundant noise. DB-types-drift and stranded-deploy still page (they are
  # specific, actionable conditions not surfaced by the run-failed email).

  assert-db-objects:
    name: Live database has the objects the app needs
    runs-on: ubuntu-latest
    # measured max 11s over 4 runs, plus headroom. Bounds a HANG, not slowness (#1062).
    timeout-minutes: 10
    # Runs AFTER the deploys, because asserting before them would measure the
    # previous release. always() so it still reports when a deploy job was
    # skipped by its paths filter, which is the common case: the objects are
    # worth checking on every push to main, not only when the worker changed.
    needs: [verify, deploy-worker, deploy-pages]
    if: always() && needs.verify.result == 'success'
    env:
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    # deploy.yml already checks that migrations are APPLIED, which is a different
    # question from whether the objects the shipping code calls exist and carry
    # the permissions it assumes. Both near misses on 2026-08-13 were in that gap:
    # a migration comment asserted anon was excluded from a security-definer
    # function while Postgres had granted EXECUTE to PUBLIC anyway, and only a live
    # privilege query caught it.
    #
    # It matters because apps/web/src/middleware.ts calls is_allowlisted() on
    # every protected request. If that were missing or its grant wrong, every
    # employee would hit /access-denied while the pipeline reported a clean deploy.
    #
    # Needs only the PUBLIC anon key, which is baked into the client bundle
    # anyway, so no new secret is introduced to check this.
    steps:
      - uses: actions/checkout@v7

      - name: Assert required objects and grants
        run: bash .github/scripts/assert-live-db-objects.sh supabase/required-live-objects.json
