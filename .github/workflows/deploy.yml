name: Deploy

on:
  push:
    branches: [main]

# supabase/setup-cli@v3 still ships Node.js 20, which GitHub deprecated.
# Force Node 24 across all JS actions until upstream publishes a v24-native release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm -r test

      # Docs are published to the public /docs site by sync-docs.mjs during
      # pages:build; this gate fails the build on broken relative links,
      # moved/renamed pages, or stale llms.txt entries before they go live.
      - name: Docs integrity (sync + link check)
        run: |
          pnpm --filter=web docs:sync
          pnpm --filter=web docs:check

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned (not `latest`) so the install doesn't resolve the latest
          # release via the GitHub API, which intermittently rate-limits and
          # fails the whole deploy (#333). Keep in sync with db-types-drift.yml.
          version: 2.107.0

      - name: Check for unapplied migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Link to the production project, then diff local migrations against
          # remote. `migration list` prints a table where a blank Remote column
          # indicates an unapplied local migration. Fail loudly so the
          # developer pushes the migration before deploys proceed.
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          OUTPUT=$(supabase migration list --linked)
          echo "$OUTPUT"
          # Unapplied rows look like: `   20260428000001 |             | 2026-04-28 ...`
          # (empty Remote between the two pipes).
          if echo "$OUTPUT" | grep -E '^[[:space:]]*[0-9]{14}[[:space:]]*\|[[:space:]]*\|' >/dev/null; then
            echo "::error::Unapplied migrations detected. Run 'supabase db push', then re-run this deploy. Migrations must be backward-compatible (expand/contract) so apply order is safe — see docs/adr/0007-expand-contract-migrations.md."
            exit 1
          fi

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
      worker_tail: ${{ steps.filter.outputs.worker_tail }}
      pages: ${{ steps.filter.outputs.pages }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            worker:
              - 'apps/worker/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            worker_tail:
              - 'apps/worker-tail/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            pages:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - 'package.json'

  deploy-worker-tail:
    name: Deploy Worker Tail
    runs-on: ubuntu-latest
    needs: [verify, changes]
    if: needs.changes.outputs.worker_tail == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Deploy Worker Tail
        run: pnpm --filter=worker-tail run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: [verify, changes]
    if: needs.changes.outputs.worker == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Deploy Worker
        # Stamp the deployed commit so GET / can report it and the Deploy Drift
        # check (#327) can detect a committed-but-never-deployed worker.
        run: pnpm --filter=worker run deploy -- --var DEPLOYED_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: [verify, changes]
    if: needs.changes.outputs.pages == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build (next-on-pages)
        run: pnpm --filter=web pages:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WORKER_URL: ${{ vars.NEXT_PUBLIC_WORKER_URL }}

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter=worker exec wrangler pages deploy ${{ github.workspace }}/apps/web/.vercel/output/static --project-name ${{ vars.CF_PAGES_PROJECT_NAME }} --commit-dirty=true --commit-message="${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3e7f907a9c19e51417873e2cce4fbc5c

  # Note: deploy failures are not Slack-alerted (reverted #328) — GitHub's
  # default Actions failure email already covers them, and the Slack page was
  # redundant noise. DB-types-drift and stranded-deploy still page (they are
  # specific, actionable conditions not surfaced by the run-failed email).
