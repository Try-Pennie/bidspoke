name: Deploy Drift

# Catches a "committed but never deployed" worker (#327): the deploy pipeline
# path-gates Deploy Worker to commits that touch apps/worker, and a failed
# Verify skips it entirely, so worker code can sit on main, unshipped, with
# nothing flagging it (hit live 2026-06-23). The live worker reports the commit
# it was deployed from at GET / (DEPLOYED_SHA); this compares that to the latest
# commit that touched apps/worker on main and alerts if the worker is behind.
#
# That comparison is a PROXY, and #802 is what it cost. Deploy decides whether
# the worker changed by building the bundle at both commits and comparing the
# bytes, while this job asked git which commits touched the apps/worker PATH.
# A commit touching only worker TEST files satisfies the second and not the
# first, so it read as a strand no deploy could ever clear: Deploy Worker skips
# it correctly, and the next hourly run sees the same gap again. Live on
# 2026-08-14, #799 merged at 20:55 with Deploy Worker skipped, and this check
# failed every hour from 21:40 with nothing whatsoever unshipped.
#
# So the cheap history check is now only a PRE-FILTER. It is a superset, meaning
# it can never miss a real strand, and being behind in history is no longer
# enough to accuse: the job then builds the worker at the live commit and at HEAD
# and pages only when the bytes actually differ (LESSONS L119, confirm against
# the primary record before acting), using the same decision script the deploy
# uses (L16, one shared predicate).

on:
  schedule:
    - cron: '17 * * * *' # hourly, offset off the top of the hour
  workflow_dispatch:
    inputs:
      driver:
        description: 'Who is running this. The worker sets cloudflare-cron; a manual run leaves the default.'
        required: false
        default: 'manual'

# Stamped into the run's display title so the worker's schedule watch can tell a
# run it drove from one a PERSON started by hand (#1058). GitHub stopped
# delivering this repo's cron events reliably on 2026-08-26, so the worker
# dispatches this itself; a driven run has to count as the schedule being alive,
# while a manual press still must not, or one click hides a dead schedule.
run-name: Deploy Drift (${{ inputs.driver || 'schedule' }})

jobs:
  drift:
    name: Live worker matches the latest worker commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The in-flight gate asks GitHub whether a Deploy is still running, and
      # this repository's default workflow token is `read`, which grants contents
      # and packages and nothing else. Without this the query was refused every
      # time, the error was discarded, and the empty answer read as "no deploy is
      # running", so the gate that exists to prevent a false page caused one
      # (#899).
      actions: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      WORKER_URL: ${{ vars.NEXT_PUBLIC_WORKER_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so merge-base can compare commits
          path: head

      - name: Compare live worker commit to the latest worker-touching commit
        id: compare
        working-directory: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIVE_SHA=$(curl -fsS "$WORKER_URL/" | jq -r '.version // "unknown"')
          LAST_WORKER_COMMIT=$(git log -1 --format=%H -- apps/worker packages)
          echo "live=$LIVE_SHA last_worker_commit=$LAST_WORKER_COMMIT"
          echo "live_sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
          echo "last_worker_commit=$LAST_WORKER_COMMIT" >> "$GITHUB_OUTPUT"

          # FIRST, before anything that could exit 0. An unstamped worker is the
          # signal that stamping itself has broken, which is exactly what this job
          # exists to report. Ordering matters: `git cat-file -e unknown^{commit}`
          # fails, so leaving this until later would route an unstamped worker into
          # the "not in this repo's history" skip and silence it.
          if [ -z "$LIVE_SHA" ] || [ "$LIVE_SHA" = "unknown" ]; then
            echo "::error::Live worker reports no deployed commit (version=${LIVE_SHA:-empty}), so stranding cannot be detected. The deploy is not stamping DEPLOYED_SHA."
            exit 1
          fi

          if ! git cat-file -e "${LIVE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::Live worker commit $LIVE_SHA is not in this repo's history; skipping."
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
            echo "confirm=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ancestor-or-equal of the deployed commit means the latest worker
          # change is already live.
          UP_TO_DATE=no
          if git merge-base --is-ancestor "$LAST_WORKER_COMMIT" "$LIVE_SHA"; then UP_TO_DATE=yes; fi
          echo "up_to_date=$UP_TO_DATE" >> "$GITHUB_OUTPUT"

          # Age of the oldest Deploy run still queued or running on main (#790),
          # through the one shared script so all three jobs handle a failed query
          # the same way. It answers with the age, or empty for a definite "none",
          # or `unavailable` when it could not find out, and those last two are
          # deliberately different words: folding them together is what caused the
          # false page on 2026-08-19 (#899). It always exits 0, so nothing here
          # needs to suppress anything.
          INFLIGHT_AGE=$(bash .github/scripts/deploy-inflight-age.sh)
          echo "inflight_age=${INFLIGHT_AGE}" >> "$GITHUB_OUTPUT"
          echo "up_to_date=$UP_TO_DATE inflight_age=${INFLIGHT_AGE:-none}"

          # Pre-pass with the artifact verdict still unknown, purely to decide
          # whether the confirming build is worth paying for. It is safe as a
          # pre-filter because the only answers it can reach without that verdict
          # are the ones the verdict cannot change: already up to date, or a
          # deploy still in flight. Anything else falls through to the real
          # comparison below, which is what actually decides.
          VERDICT=$(bash .github/scripts/deploy-drift-decision.sh "$LIVE_SHA" "$UP_TO_DATE" "$INFLIGHT_AGE" unknown)
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          if [ "$VERDICT" = "ok" ] || [ "$VERDICT" = "deploy-in-flight" ]; then
            echo "confirm=false" >> "$GITHUB_OUTPUT"
          else
            echo "confirm=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report the settled state
        if: steps.compare.outputs.confirm != 'true'
        run: |
          case "${{ steps.compare.outputs.verdict }}" in
            ok) echo "Worker is up to date." ;;
            skip) echo "Live commit is not in this repository's history; nothing to compare." ;;
            deploy-in-flight)
              # Not a strand: a deploy is mid-flight and the worker is expected to
              # be behind until it lands. The next hourly run judges the settled
              # state, and a deploy stuck past the ceiling still pages.
              echo "::notice::A deploy is still running (${{ steps.compare.outputs.inflight_age }}s). Not paging; the next run will re-check." ;;
          esac

      # Everything below runs only when the cheap check suspects a strand. The
      # steady state after any worker deploy is `ok`, so no build is paid for.
      - name: Restore a previous confirmation for this exact pair of commits
        id: cache
        if: steps.compare.outputs.confirm == 'true'
        uses: actions/cache@v6
        with:
          path: artifact-verdict.txt
          # Keyed on both commits exactly, never on a cheaper stand-in for them
          # (L40). Two commits fully determine the two builds, so a hit is the
          # same answer a rebuild would produce. Both hashes are also always
          # produced by the SAME run, so a change to the runner image can never
          # make a cached hash and a fresh one falsely disagree.
          key: drift-artifact-${{ steps.compare.outputs.live_sha }}-${{ github.sha }}

      - name: Check out the live commit
        if: steps.compare.outputs.confirm == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.compare.outputs.live_sha }}
          path: live

      - uses: pnpm/action-setup@v6
        if: steps.compare.outputs.confirm == 'true' && steps.cache.outputs.cache-hit != 'true'
        with:
          version: 9

      # Deliberately no `cache: 'pnpm'`, matching deploy.yml's gate: a cache
      # shared between the two installs is the contamination route #725 flagged
      # as unproven, and correctness here is worth more than the cache.
      - uses: actions/setup-node@v7
        if: steps.compare.outputs.confirm == 'true' && steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'

      - name: Build the worker at both commits and compare the artifacts
        id: artifact
        if: steps.compare.outputs.confirm == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          set -uo pipefail
          # Hashes dist/index.js only, never the whole outdir: the sibling
          # sourcemap embeds sourceRoot, which equals the --outdir path, so
          # hashing the directory would measure the harness rather than the
          # artifact (#725).
          build_hash() {
            ( cd "$1" && pnpm install --frozen-lockfile >/dev/null 2>&1 \
              && pnpm --filter=worker run build >/dev/null 2>&1 \
              && sha256sum apps/worker/dist/index.js | cut -d' ' -f1 ) || true
          }
          HEAD_HASH=$(build_hash head)
          LIVE_HASH=$(build_hash live)
          echo "head_hash=${HEAD_HASH:-none} live_hash=${LIVE_HASH:-none}"

          # An empty hash means a build did not produce an artifact, and two
          # empty hashes must never read as a match. Kept in a script rather than
          # here so it is covered by drift-artifact-verdict.test.ts: shell living
          # in workflow YAML has no test that can reach it.
          ARTIFACT=$(bash head/.github/scripts/drift-artifact-verdict.sh \
            "${{ steps.compare.outputs.live_sha }}" "$HEAD_HASH" "$LIVE_HASH")
          printf '%s\n' "$ARTIFACT" > artifact-verdict.txt

      - name: Decide and alert
        if: steps.compare.outputs.confirm == 'true'
        run: |
          set -uo pipefail
          ARTIFACT=$(cat artifact-verdict.txt 2>/dev/null || echo unknown)
          echo "artifact=$ARTIFACT"
          LIVE_SHA='${{ steps.compare.outputs.live_sha }}'
          LAST_WORKER_COMMIT='${{ steps.compare.outputs.last_worker_commit }}'

          DECISION=$(bash head/.github/scripts/deploy-drift-decision.sh \
            "$LIVE_SHA" '${{ steps.compare.outputs.up_to_date }}' \
            '${{ steps.compare.outputs.inflight_age }}' "$ARTIFACT")

          if [ "$DECISION" = "ok" ]; then
            echo "::notice::The worker is behind in history, but the built artifact is byte identical to what is live, so nothing is unshipped."
            exit 0
          fi
          if [ "$DECISION" = "deploy-in-flight" ]; then
            echo "::notice::A deploy is still running. Not paging; the next run will re-check."
            exit 0
          fi

          if [ "$DECISION" = "alert-inflight-unknown" ]; then
            echo "::error::Deploy Drift could not tell whether a deploy is running: the worker is behind $LAST_WORKER_COMMIT and the in-flight query failed."
            TEXT=$(printf '*Deploy Drift cannot tell whether a deploy is running*\n\nThe live worker (`%s`) is behind `apps/worker` commit `%s`, and the query that asks whether a Deploy is still in flight could not be answered. So a worker that is merely mid deploy cannot be told apart from one that is genuinely unshipped, and this check cannot report either while that is true.\n\n*How to fix:* open the run and read the `deploy-inflight` line, which says why the query failed. The job needs `actions: read` to ask GitHub for in-flight runs, and this repository grants the workflow token only contents and packages by default.\n\n<%s/%s/actions/runs/%s|Open this check>' \
              "${LIVE_SHA:0:7}" "${LAST_WORKER_COMMIT:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          elif [ "$DECISION" = "alert-unconfirmed" ]; then
            echo "::error::Deploy Drift could not confirm: the worker is behind $LAST_WORKER_COMMIT and the artifact comparison did not complete."
            TEXT=$(printf '*Deploy Drift could not check the worker*\n\nThe live worker (`%s`) is behind `apps/worker` commit `%s`, and the build that confirms whether that matters did not complete. Until it does, this check cannot tell a genuinely stranded worker from a commit that changes nothing shippable.\n\n*How to fix:* open the run and read the build step. This check stays unable to report a real strand while it keeps failing here.\n\n<%s/%s/actions/runs/%s|Open this check>' \
              "${LIVE_SHA:0:7}" "${LAST_WORKER_COMMIT:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          else
            echo "::error::Stranded worker: apps/worker changed in $LAST_WORKER_COMMIT, the built artifact differs from what is live, and the live worker is $LIVE_SHA."
            TEXT=$(printf '*Worker code is committed but not deployed*\n\nThe live worker is running `%s`, and building `apps/worker` at commit `%s` produces a different bundle, so shipping code is sitting on main unshipped. This happens when a deploy failed at Verify.\n\n*How to fix:* re-run the most recent Deploy run on main (apply any pending migration first with `supabase db push`). Pushing an empty worker change will not help: the deploy compares the built bundle, so a change that does not move it is skipped.\n\n<%s/%s/actions/runs/%s|Open this check>' \
              "${LIVE_SHA:0:7}" "${LAST_WORKER_COMMIT:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          fi

          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg text "$TEXT" '{text: $text}')"
          fi
          exit 1

  pages:
    name: Live site matches the latest apps/web commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The in-flight gate asks GitHub whether a Deploy is still running, and
      # this repository's default workflow token is `read`, which grants contents
      # and packages and nothing else. Without this the query was refused every
      # time, the error was discarded, and the empty answer read as "no deploy is
      # running", so the gate that exists to prevent a false page caused one
      # (#899).
      actions: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
    # The site half of the same defect (#804). Deploy Drift watched only the
    # Worker, so a failed or skipped Pages deploy left the site serving an older
    # build with nothing flagging it.
    #
    # Two differences from the worker job above.
    #
    # A Pages deploy propagates PER ROUTE, and a prod scan has genuinely served
    # the old bundle on some routes and the new one on others, which reads
    # exactly like a missed fix. One version endpoint cannot answer for the site,
    # so this samples several routes spanning both propagation paths: the
    # prerendered static assets and the edge-rendered functions.
    #
    # And there is no artifact to confirm against, so the accusation cannot be
    # confirmed the way #802 taught the worker job to. It does not need to be:
    # the pages paths filter that gates Deploy Pages is the SAME list this job
    # asks git about (L144), so a commit that satisfies one satisfies the other
    # and the #802 shape cannot occur here. A test asserts those two lists stay
    # identical.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so merge-base can compare commits

      - name: Sample the live site
        id: sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # An unset repository variable arrives as the EMPTY STRING, not as
          # absent, so this is checked explicitly rather than left to a default
          # that would silently accept it and scan nothing (LESSONS L138).
          if [ -z "${SITE_URL:-}" ]; then
            echo "::error::The SITE_URL repository variable is unset, so there is nothing to scan. Set it to the public site origin."
            exit 1
          fi

          # Both prerendered and edge-rendered routes, all public so the gate
          # does not redirect them to /login and leave us reading a redirect
          # instead of a page.
          ROUTES="/login /access-denied /dev/nodes /docs"

          # The same paths that gate Deploy Pages in deploy.yml. Asking a
          # different question than the deploy asks is exactly what made the
          # worker check page for a month with nothing unshipped (#802, L144).
          LAST_WEB_COMMIT=$(git log -1 --format=%H -- apps/web packages pnpm-lock.yaml package.json)
          echo "last_web_commit=$LAST_WEB_COMMIT" >> "$GITHUB_OUTPUT"

          OBSERVATIONS=""
          for ROUTE in $ROUTES; do
            # --retry so a single blip does not page. The site being genuinely
            # down is a real finding; one dropped connection is not.
            if ! BODY=$(curl -fsS --max-time 20 --retry 2 --retry-delay 3 "${SITE_URL}${ROUTE}" 2>/dev/null); then
              OBSERVATIONS="$OBSERVATIONS ${ROUTE}=unreachable"
              continue
            fi

            SERVED=$(printf '%s' "$BODY" | bash .github/scripts/pages-commit-from-html.sh)
            if [ "$SERVED" = "unstamped" ]; then
              OBSERVATIONS="$OBSERVATIONS ${ROUTE}=unstamped"
            elif ! git cat-file -e "${SERVED}^{commit}" 2>/dev/null; then
              OBSERVATIONS="$OBSERVATIONS ${ROUTE}=unknown"
            elif git merge-base --is-ancestor "$LAST_WEB_COMMIT" "$SERVED"; then
              OBSERVATIONS="$OBSERVATIONS ${ROUTE}=current"
            else
              OBSERVATIONS="$OBSERVATIONS ${ROUTE}=behind"
            fi
          done
          echo "observations=${OBSERVATIONS# }" >> "$GITHUB_OUTPUT"
          echo "observations:${OBSERVATIONS}"

          # Age of the oldest Deploy run still queued or running on main (#790),
          # through the one shared script so all three jobs handle a failed query
          # the same way. It answers with the age, or empty for a definite "none",
          # or `unavailable` when it could not find out, and those last two are
          # deliberately different words: folding them together is what caused the
          # false page on 2026-08-19 (#899). It always exits 0, so nothing here
          # needs to suppress anything.
          INFLIGHT_AGE=$(bash .github/scripts/deploy-inflight-age.sh)
          echo "inflight_age=${INFLIGHT_AGE}" >> "$GITHUB_OUTPUT"

      - name: Decide and alert
        run: |
          set -uo pipefail
          LAST_WEB_COMMIT='${{ steps.sample.outputs.last_web_commit }}'
          OBSERVATIONS='${{ steps.sample.outputs.observations }}'

          # Unquoted on purpose: the observations are one space-separated word per
          # route, and each must arrive as its own argument.
          # shellcheck disable=SC2086
          DECISION=$(bash .github/scripts/pages-drift-decision.sh \
            '${{ steps.sample.outputs.inflight_age }}' $OBSERVATIONS)
          echo "decision=$DECISION observations=$OBSERVATIONS"

          case "$DECISION" in
            ok)
              echo "::notice::Every sampled route is serving the latest apps/web commit."
              exit 0 ;;
            deploy-in-flight)
              echo "::notice::A deploy is still running, so some routes are expected to be behind. The next run judges the settled state."
              exit 0 ;;
            alert-behind|alert-stuck-deploy)
              HEADLINE='*The site is serving an older build*'
              DETAIL=$(printf 'These routes are not yet serving `%s`, the latest commit touching the site: `%s`.\n\n*How to fix:* re-run the most recent Deploy run on main. A Pages deploy propagates per route, so a partial state can also settle on its own within a few minutes, which the next hourly run will confirm.' "${LAST_WEB_COMMIT:0:7}" "$OBSERVATIONS") ;;
            alert-inflight-unknown)
              # Distinct from alert-behind on purpose. Telling the reader to
              # re-run a deploy would send them after a deploy that was never
              # the problem, and it is the reason this check paged on
              # 2026-08-19 while the site was deploying perfectly normally.
              HEADLINE='*The site drift check cannot tell whether a deploy is running*'
              DETAIL=$(printf 'These routes are not yet serving `%s` (`%s`), and the query that asks whether a Deploy is still in flight could not be answered. A site that is simply mid deploy therefore cannot be told apart from one serving a genuinely older build.\n\n*How to fix:* open the run and read the `deploy-inflight` line, which says why the query failed. The job needs `actions: read` to ask GitHub for in-flight runs, and this repository grants the workflow token only contents and packages by default.' "${LAST_WEB_COMMIT:0:7}" "$OBSERVATIONS") ;;
            alert-unstamped)
              HEADLINE='*The site cannot say which build it is serving*'
              DETAIL=$(printf 'At least one route answered with no usable build stamp (`%s`), so a stranded site can no longer be detected at all. This means `NEXT_PUBLIC_COMMIT_SHA` is not reaching the Pages build.\n\n*How to fix:* check the Build (next-on-pages) step in deploy.yml still sets it. It is inlined at compile time, so it has to be on the build step, not the upload.' "$OBSERVATIONS") ;;
            alert-unknown-commit)
              HEADLINE='*The site is serving a commit this repository does not have*'
              DETAIL=$(printf 'A route named a commit that is not in main history (`%s`), so what is live cannot be placed against the repository. This usually means a deploy went out from a branch or a local build.\n\n*How to fix:* re-run Deploy on main to put a known commit back on the site.' "$OBSERVATIONS") ;;
            alert-unreachable)
              HEADLINE='*The site did not answer*'
              DETAIL=$(printf 'At least one public route could not be fetched after retries (`%s`).\n\n*How to fix:* open the site. If it loads, this was transient and the next hourly run will clear it; if it does not, the site is down.' "$OBSERVATIONS") ;;
            *)
              # alert-no-samples and alert-malformed. The check itself is broken,
              # which is its own outcome and never a quiet pass: a scan that
              # measured nothing is indistinguishable from one that found
              # everything healthy (L98).
              HEADLINE='*The site drift check could not run*'
              DETAIL=$(printf 'The check returned `%s` for observations `%s`, so it measured nothing usable and cannot report a stranded site while it stays in this state.\n\n*How to fix:* open the run and read the sampling step.' "$DECISION" "$OBSERVATIONS") ;;
          esac

          echo "::error::$DECISION: $OBSERVATIONS"
          TEXT=$(printf '%s\n\n%s\n\n<%s/%s/actions/runs/%s|Open this check>' \
            "$HEADLINE" "$DETAIL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg text "$TEXT" '{text: $text}')"
          fi
          exit 1

  worker_tail:
    name: Live tail worker matches the latest tail commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The in-flight gate asks GitHub whether a Deploy is still running, and
      # this repository's default workflow token is `read`, which grants contents
      # and packages and nothing else. Without this the query was refused every
      # time, the error was discarded, and the empty answer read as "no deploy is
      # running", so the gate that exists to prevent a false page caused one
      # (#899).
      actions: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TAIL_URL: ${{ vars.WORKER_TAIL_URL }}
    # The third deploy target (#739). apps/worker-tail computes per-execution
    # cost attribution and writes workflow_executions.cost_usd, so a stranded one
    # does not fail: it under-reports what executions cost while the dashboard
    # goes on showing numbers nobody has reason to doubt. That is the worst shape
    # a stranded deploy can take.
    #
    # Simpler than the engine job above, for a reason worth stating. The engine
    # deploy decides from the built BUNDLE, so history is only a pre-filter there
    # and an accusation has to be confirmed against the artifact (#802). The tail
    # deploy has no artifact gate: it fires on its paths filter alone. So the
    # paths filter IS the deploy's own predicate, this job asks git the same
    # question over the same paths, and the two cannot disagree (L144). A test
    # asserts the two path lists stay identical.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so merge-base can compare commits

      - name: Compare the live tail worker to the latest tail commit
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # An unset repository variable arrives as the EMPTY STRING, not as
          # absent, so it is checked rather than allowed to build a URL that
          # would fail to resolve and read like a dead worker (L138).
          if [ -z "${TAIL_URL:-}" ]; then
            echo "::error::The WORKER_TAIL_URL repository variable is unset, so the tail worker cannot be checked."
            exit 1
          fi

          # Unreachable and unstamped are kept apart from here on. A worker that
          # did not answer and a worker whose deploy forgot the stamp need two
          # different actions, and folding them into one message sends the reader
          # to check the wrong thing (LESSONS L11). --retry absorbs a single blip;
          # a worker that keeps refusing is a real finding.
          if BODY=$(curl -fsS --max-time 20 --retry 2 --retry-delay 3 "$TAIL_URL" 2>/dev/null); then
            TAIL_SHA=$(printf '%s' "$BODY" | jq -r '.version // "unknown"' 2>/dev/null) || TAIL_SHA="unknown"
          else
            echo "::error::The live tail worker did not answer at $TAIL_URL after retries, so whether it is stranded cannot be determined."
            echo "verdict=alert-unreachable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The same paths that gate Deploy Worker Tail in deploy.yml.
          LAST_TAIL_COMMIT=$(git log -1 --format=%H -- apps/worker-tail packages pnpm-lock.yaml package.json)
          echo "tail=$TAIL_SHA last_tail_commit=$LAST_TAIL_COMMIT"
          echo "last_tail_commit=$LAST_TAIL_COMMIT" >> "$GITHUB_OUTPUT"

          # FIRST, before anything that could exit 0, and for the same reason the
          # engine job checks it first: an unstamped worker is the signal that
          # stamping itself has broken, which is exactly what this exists to
          # report. `git cat-file -e unknown^{commit}` fails, so leaving this
          # until later would route it into the not-in-history skip and silence
          # the one condition that makes stranding undetectable (#327).
          if [ -z "$TAIL_SHA" ] || [ "$TAIL_SHA" = "unknown" ] || [ "$TAIL_SHA" = "null" ]; then
            echo "::error::The live tail worker answered but reports no deployed commit (version=${TAIL_SHA:-empty}), so stranding cannot be detected. The deploy is not stamping DEPLOYED_SHA."
            echo "verdict=alert-unstamped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${TAIL_SHA}^{commit}" 2>/dev/null; then
            echo "::error::The live tail worker reports commit $TAIL_SHA, which is not in this repository's history."
            echo "verdict=alert-unknown-commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UP_TO_DATE=no
          if git merge-base --is-ancestor "$LAST_TAIL_COMMIT" "$TAIL_SHA"; then UP_TO_DATE=yes; fi

          # Age of the oldest Deploy run still queued or running on main (#790),
          # through the one shared script so all three jobs handle a failed query
          # the same way. It answers with the age, or empty for a definite "none",
          # or `unavailable` when it could not find out, and those last two are
          # deliberately different words: folding them together is what caused the
          # false page on 2026-08-19 (#899). It always exits 0, so nothing here
          # needs to suppress anything.
          INFLIGHT_AGE=$(bash .github/scripts/deploy-inflight-age.sh)

          # `not-gated` is the artifact verdict for a target with no artifact
          # gate: history is authoritative here because the paths filter is the
          # deploy's own predicate, so being behind in history IS the confirmed
          # condition rather than merely a suspicion.
          VERDICT=$(bash .github/scripts/deploy-drift-decision.sh "$TAIL_SHA" "$UP_TO_DATE" "$INFLIGHT_AGE" not-gated)
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "tail_sha=$TAIL_SHA up_to_date=$UP_TO_DATE inflight=${INFLIGHT_AGE:-none} verdict=$VERDICT"

      - name: Decide and alert
        run: |
          set -uo pipefail
          VERDICT='${{ steps.compare.outputs.verdict }}'
          LAST='${{ steps.compare.outputs.last_tail_commit }}'

          case "$VERDICT" in
            ok)
              echo "::notice::The tail worker is up to date."
              exit 0 ;;
            deploy-in-flight)
              echo "::notice::A deploy is still running, so the tail worker is expected to be behind. The next run judges the settled state."
              exit 0 ;;
            alert-inflight-unknown)
              TEXT=$(printf '*The cost tail worker check cannot tell whether a deploy is running*\n\nThe live tail worker is behind `apps/worker-tail` commit `%s`, and the query that asks whether a Deploy is still in flight could not be answered, so a tail worker that is merely mid deploy cannot be told apart from a stranded one.\n\n*How to fix:* open the run and read the `deploy-inflight` line, which says why the query failed. The job needs `actions: read` to ask GitHub for in-flight runs, and this repository grants the workflow token only contents and packages by default.\n\n<%s/%s/actions/runs/%s|Open this check>' \
                "${LAST:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID") ;;
            alert-unstamped)
              TEXT=$(printf '*The cost tail worker cannot say which build it is running*\n\nIt answered with no deployed commit, so a stranded tail worker can no longer be detected. While this is true, per-execution cost attribution could be running old code and the dashboard would show numbers that look fine.\n\n*How to fix:* check the Deploy Worker Tail step still passes `--var DEPLOYED_SHA`, and that it uses `exec` rather than `run ... --`, which wrangler silently ignores.\n\n<%s/%s/actions/runs/%s|Open this check>' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID") ;;
            alert-unreachable)
              TEXT=$(printf '*The cost tail worker did not answer*\n\nIt could not be reached after retries, so whether it is running current code is unknown. It writes per-execution cost, so while this is true the cost figures on the dashboard cannot be vouched for.\n\n*How to fix:* open the worker in Cloudflare. If it is healthy this was transient and the next hourly run clears it.\n\n<%s/%s/actions/runs/%s|Open this check>' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID") ;;
            alert-unknown-commit)
              TEXT=$(printf '*The cost tail worker is running a commit this repository does not have*\n\nWhat is live cannot be placed against main, so it cannot be told apart from a stranded deploy. This usually means it went out from a branch or a local build.\n\n*How to fix:* re-run Deploy on main to put a known commit back on it.\n\n<%s/%s/actions/runs/%s|Open this check>' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID") ;;
            *)
              TEXT=$(printf '*Cost tail worker code is committed but not deployed*\n\nThe live tail worker is behind `apps/worker-tail` commit `%s`. It is not failing, which is the problem: it writes per-execution cost, so a stranded copy under-reports what executions cost while the dashboard keeps showing numbers that look fine.\n\n*How to fix:* re-run the most recent Deploy run on main.\n\n<%s/%s/actions/runs/%s|Open this check>' \
                "${LAST:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID") ;;
          esac

          echo "::error::tail worker drift: $VERDICT (latest tail commit $LAST)"
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg text "$TEXT" '{text: $text}')"
          fi
          exit 1
