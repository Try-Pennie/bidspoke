name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Test worker
        run: pnpm --filter worker test

      - name: Test web
        run: pnpm --filter web test

  db-types-fresh:
    name: DB types regenerated with schema migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Fast reminder: if a migration changes table/column/type DDL but the
      # generated Supabase types weren't regenerated, the typed client drifts
      # from reality. Index/RLS/function/grant-only migrations don't affect the
      # types, so they're allowed through. The nightly db-types-drift workflow is
      # the authoritative correctness check against the live schema.
      #
      # Runs on push to main too, not just PRs (#364): the team pushes directly
      # to main, so a PR-only gate never fires and drift was only caught hours
      # later by the nightly cron. The diff base differs by event: a PR diffs
      # against its base branch; a push diffs against the commit before it.
      - name: Require a types regen when migrations change schema DDL
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fall back to the parent commit when the base is unusable: a new
          # branch or force-push reports an all-zero / missing 'before' SHA.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          MIGS=$(echo "$CHANGED" | grep -E '^supabase/migrations/.*\.sql$' || true)
          if [ -z "$MIGS" ]; then
            echo "No migration changes — nothing to check."
            exit 0
          fi
          if echo "$MIGS" | xargs grep -ilE 'create table|drop table|add column|drop column|alter column|rename column|create type|alter type|create view|drop view|create materialized view' >/dev/null 2>&1; then
            if ! echo "$CHANGED" | grep -qx 'apps/worker/src/types/database.ts'; then
              echo "::error::A migration changes table/column/type DDL but apps/worker/src/types/database.ts was not regenerated. Run 'pnpm --filter worker db:types' and commit the result."
              exit 1
            fi
          fi
          echo "DB types freshness check passed."
