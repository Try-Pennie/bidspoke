name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job sets timeout-minutes. GitHub's default is 360, so without one a
# stalled step does not fail, it HANGS, and a hang is indistinguishable from
# slowness: the PR sits at "pending" and nobody has a reason to look (L110).
# Measured 2026-08-19 (#885): the a11y job stalled on Install Chromium three
# times, ~20 minutes each, on a branch touching no frontend code, and never
# reached an assertion. The values below are the observed durations with
# headroom, not guesses. A guard test enforces their presence:
# apps/web/src/lib/__tests__/ci-job-timeouts.test.ts
jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every workspace package with a `test` script must appear here. The list is
      # named rather than recursive, so a new package's suite would otherwise be
      # green locally and unrun in CI, silently. Guarded by
      # apps/web/src/lib/__tests__/ci-runs-every-package-suite.test.ts (#869).
      - name: Test shared packages
        run: pnpm --filter @bidspoke/uuidv7 test

      - name: Test worker
        run: pnpm --filter worker test

      - name: Test web
        run: pnpm --filter web test

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The repo default workflow token grants contents and packages read, NOT
    # pull-requests, so the changed-files lookup below needs this explicitly.
    # Without it the lookup fails, the job fails closed and scans everything,
    # and the scoping is silently inert while every run still reports success.
    # direct-push-guard declares the same pair for the same reason.
    permissions:
      contents: read
      pull-requests: read
    # Runs e2e/a11y.spec.ts against THIS commit's UI (#673). Nothing ran the Playwright
    # suite automatically before, which is how six specs drifted from the app unnoticed
    # until #670: a KPI was renamed, a delete control moved behind a menu, and the specs
    # only failed when someone remembered to run them.
    #
    # Only the a11y spec runs. It creates no fixtures, so it needs no cleanup, and it is
    # the one spec whose failure is always about the UI rather than test data.
    env:
      # Baked into the client bundle at compile time, so they must be the real values:
      # a wrong NEXT_PUBLIC_WORKER_URL leaves the authenticated pages retrying a dead
      # endpoint, and the specs then time out waiting for the network to go idle.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_WORKER_URL: ${{ vars.NEXT_PUBLIC_WORKER_URL }}
      E2E_EMAIL: ${{ vars.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      BASE_URL: http://localhost:3000
      # This run creates nothing, so it must not sweep. Otherwise every PR would fire a
      # DELETE at the production Worker, and the Worker being down would fail an
      # accessibility gate. See shouldSkipTeardown in apps/web/e2e/cleanup.ts.
      E2E_SKIP_TEARDOWN: '1'
    steps:
      - uses: actions/checkout@v7

      # Dependabot PRs and forks are not given secrets, so the sign-in in global-setup
      # cannot run there. Those skip rather than fail for a credential they were never
      # going to have.
      #
      # Anything else MUST fail instead of skipping. A deleted or emptied secret would
      # otherwise skip every run, each reporting a green check, and nobody would be told:
      # a gate that quietly switches itself off is the exact rot this job exists to stop.
      # This job is the only one that installs a browser, builds the production
      # artifact and boots the app, so it costs minutes while the rest cost
      # seconds. It blocked #885 three times, a branch touching no web code,
      # without ever examining anything (#887).
      #
      # It FAILS CLOSED. The risk of scoping a gate is the rot this job's own
      # comments name: one that quietly switches itself off. So the skip applies
      # only when the job can PROVE nothing under apps/web changed. If it cannot
      # tell, for any reason, it runs. Seven wasted minutes is cheap; an
      # accessibility regression waved through by a detection bug is not.
      #
      # Read from the API rather than `git diff`, because checkout fetches depth
      # 1 and the base commit is simply not present to diff against.
      - name: Check whether web code changed
        id: web
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "${PR}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a pull request, so the accessibility scan runs."
            exit 0
          fi
          if ! files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename'); then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not determine the changed files, so the accessibility scan runs. Failing closed."
            exit 0
          fi
          if [ -z "${files}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not determine the changed files (empty list), so the accessibility scan runs. Failing closed."
            exit 0
          fi
          if printf '%s\n' "${files}" | grep -q '^apps/web/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No apps/web changes in this pull request, so the accessibility scan is skipped."
          fi

      - name: Check for e2e credentials
        id: creds
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "${E2E_PASSWORD}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${IS_FORK}" = "true" ] || [ "${GITHUB_ACTOR}" = "dependabot[bot]" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No E2E_PASSWORD on a fork or Dependabot PR, so the accessibility scan is skipped."
            exit 0
          fi
          echo "::error::E2E_PASSWORD is not set on a trusted run, so the accessibility scan cannot sign in. Restore the secret rather than letting this gate skip silently."
          exit 1

      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.have == 'true' && steps.web.outputs.changed == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.have == 'true' && steps.web.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.creds.outputs.have == 'true' && steps.web.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      # Without this the browser is re-downloaded on EVERY pull request, so every
      # run depends on Playwright's CDN being healthy. That download is what
      # stalled three times on 2026-08-19 (#885).
      - name: Cache the Playwright browser
        if: steps.creds.outputs.have == 'true' && steps.web.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ms-playwright-${{ runner.os }}-

      - name: Install Chromium
        if: steps.creds.outputs.have == 'true' && steps.web.outputs.changed == 'true'
        # Deliberately WITHOUT --with-deps. That flag runs a package-manager
        # install which no cache can hold, and it is what stalled: five times on
        # 2026-08-19, about twenty minutes each, each ended only by the job
        # timeout. The runner image already carries the libraries Chromium needs,
        # so this is now a pure download and the cache above covers it fully.
        #
        # If a future runner image drops a library, Playwright fails at browser
        # LAUNCH naming the missing library. That is a legible failure rather
        # than a hang, which is the whole trade. Do not add the flag back to
        # "fix" such a failure without first checking which library is missing.
        run: pnpm --filter web exec playwright install chromium

      # Build what production actually runs (#678). This gate is mostly about colour
      # contrast, which is a function of rendered CSS, so scanning the dev server meant
      # scanning a close cousin of the real thing: a contrast regression appearing only in
      # a production build could pass. #674 made that concrete, finding 16 real contrast
      # failures on the deployed app.
      #
      # `next build && next start` is not an option: 16 pages are `runtime = 'edge'` for
      # Cloudflare Pages and a Node server 500s on every one, leaving only /login
      # scannable. The next-on-pages artifact under `wrangler pages dev` is the real
      # artifact, and is what Deploy uploads to Pages.
      #
      # NEXT_PUBLIC_* must be present at BUILD time (they are compiled into the bundle,
      # not read at runtime). A wrong NEXT_PUBLIC_WORKER_URL leaves authenticated pages
      # retrying a dead endpoint until every spec times out on networkidle.
      - name: Build the production artifact (next-on-pages)
        if: steps.creds.outputs.have == 'true' && steps.web.outputs.changed == 'true'
        run: pnpm --filter=web pages:build

      # Serve the built artifact exactly as Pages runs it. The compatibility date MUST be
      # pinned: `wrangler pages dev` otherwise defaults it to TODAY, and the installed
      # workerd refuses a date it does not support yet, so an unpinned job breaks on a
      # random future day for no reason anyone would connect to their change.
      #
      # These two values mirror the Pages project's production deployment config
      # (bidspoke -> deployment_configs.production). If they are changed there, change
      # them here too, or this gate quietly stops scanning what production runs.
      #
      # Two constraints pull against each other here, so read before simplifying:
      #
      #   1. wrangler is a dependency of apps/worker, NOT apps/web (Deploy likewise runs
      #      it via --filter=worker). So the binary only exists under apps/worker.
      #   2. wrangler must nonetheless RUN from apps/web. From apps/worker it picks up
      #      that package's wrangler.toml and serves the worker instead of the site.
      #
      # Hence the explicit path to the worker's binary with working-directory: apps/web.
      # That also means this gate uses the exact wrangler the real deploy uses.
      #
      # Do NOT reach for `npx wrangler`: apps/web does not declare wrangler, so npx
      # resolves it from wherever it likes (locally it silently fetched an older 4.65.0
      # instead of the pinned 4.110.0) and on CI it fails outright with
      # "sh: 1: wrangler: not found".
      - name: Start the app (wrangler pages dev)
        if: steps.creds.outputs.have == 'true' && steps.web.outputs.changed == 'true'
        working-directory: apps/web
        run: |
          "${GITHUB_WORKSPACE}/apps/worker/node_modules/.bin/wrangler" pages dev .vercel/output/static \
            --port 3000 \
            --compatibility-date=2026-04-06 \
            --compatibility-flags=nodejs_compat \
            > "${RUNNER_TEMP}/pages-dev.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then
              echo "Pages dev server up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Pages dev server did not come up within 60s."
          cat "${RUNNER_TEMP}/pages-dev.log"
          exit 1

      # No warm-up step: unlike the dev server, the artifact is prebuilt and serves every
      # route immediately, so there is no first-request compile to absorb.
      - name: Run accessibility specs
        if: steps.creds.outputs.have == 'true' && steps.web.outputs.changed == 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/a11y-report.json
        run: pnpm --filter web exec playwright test e2e/a11y.spec.ts --reporter=json,list

      # A scan over zero pages reports zero violations, which is indistinguishable
      # from a clean pass (#797, and #779 is what that costs: eighteen days of a
      # green Security scans job auditing nothing). `playwright test` exits 0 when
      # its filter matches no files, so the run has to prove what it covered.
      #
      # The floor is a minimum, not an equality, so adding a page does not fail
      # the gate until someone bumps a number. A unit test keeps it in step with
      # the page list the spec actually declares.
      - name: Prove the accessibility scan covered its pages
        if: steps.creds.outputs.have == 'true' && steps.web.outputs.changed == 'true'
        run: node .github/scripts/playwright-coverage.mjs "${{ runner.temp }}/a11y-report.json" 10

      - name: Upload Playwright report
        if: failure() && steps.creds.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-a11y-report
          path: apps/web/playwright-report/
          retention-days: 7

  auth-gate:
    name: Auth gate fails closed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Issue #728. The login protection was untested while looking tested: the browser
    # spec asserted /workflows "ends at /login", which still passes with middleware.ts
    # deleted, because the API client redirects to /login on any 401. This job asks the
    # question over raw HTTP against the artifact production serves, and requires the
    # x-bidspoke-gate header, so "the gate redirected" is distinguishable from "the gate
    # never ran and something else did".
    #
    # It runs on every PR including Dependabot and forks: it never signs in, so unlike
    # the a11y job it needs no secret and has no reason to skip. It DOES need the
    # NEXT_PUBLIC_* repo variables at build time, and the probe refuses a
    # 'gate-unavailable' verdict so a build without them fails loudly instead of passing
    # vacuously on a redirect the catch-deny produced.
    #
    # Deliberately its own job rather than a step inside a11y: the a11y guard test reads
    # `playwright test (\S+)` out of that job and checks the captured path exists, so a
    # second playwright invocation there would break it for an unrelated reason.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_WORKER_URL: ${{ vars.NEXT_PUBLIC_WORKER_URL }}
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      # The build bakes these in at compile time. Missing values make createServerClient
      # throw on every request, which the catch-deny converts into a /login redirect: the
      # gate would look like it was working while never having evaluated anything. Fail
      # here, where the cause is legible, rather than letting the probe infer it.
      - name: Check the build-time public config is present
        run: |
          missing=""
          [ -n "${NEXT_PUBLIC_SUPABASE_URL}" ] || missing="${missing} NEXT_PUBLIC_SUPABASE_URL"
          [ -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY}" ] || missing="${missing} NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "${missing}" ]; then
            echo "::error::Missing build-time config:${missing}. Without it the gate cannot run and this probe would pass vacuously."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build and serve exactly what Pages runs, for the same reasons the a11y job does:
      # the middleware is compiled into the next-on-pages worker, and whether it runs
      # BEFORE static assets is a property of that artifact, not of the dev server.
      - name: Build the production artifact (next-on-pages)
        run: pnpm --filter=web pages:build

      - name: Start the app (wrangler pages dev)
        working-directory: apps/web
        run: |
          "${GITHUB_WORKSPACE}/apps/worker/node_modules/.bin/wrangler" pages dev .vercel/output/static \
            --port 3000 \
            --compatibility-date=2026-04-06 \
            --compatibility-flags=nodejs_compat \
            > "${RUNNER_TEMP}/pages-dev-gate.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then
              echo "Pages dev server up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Pages dev server did not come up within 60s."
          cat "${RUNNER_TEMP}/pages-dev-gate.log"
          exit 1

      - name: Probe the auth gate
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/gate-report.json
        run: pnpm --filter web exec playwright test --config=playwright.gate.config.ts --reporter=json,list

      # Same reasoning as the accessibility job (#797). Every assertion in the
      # probe is strong, and none of them can fire if the config matches no spec
      # files, which exits 0.
      - name: Prove the auth gate probe covered its paths
        run: node .github/scripts/playwright-coverage.mjs "${{ runner.temp }}/gate-report.json" 23

  db-types-fresh:
    name: DB types regenerated with schema migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fast reminder: if a migration changes table/column/type DDL but the
      # generated Supabase types weren't regenerated, the typed client drifts
      # from reality. Index/RLS/grant-only migrations don't affect the types, so
      # they're allowed through. The nightly db-types-drift workflow is the
      # authoritative correctness check against the live schema.
      #
      # FUNCTION migrations are NOT all allowed through (#853). `supabase gen
      # types` emits a Functions block, so a NEW function moves the types: #770
      # added public.pg_cron_health, this gate passed, and the nightly check
      # failed the next morning with the committed types stale (#845). The
      # decision script compares the function names the diff declares against the
      # names the committed types already record, because at PR time the migration
      # has not been applied yet and there is no live schema to regenerate from. A
      # replace of an already-recorded function, and any trigger function, stay
      # quiet: the types never carry those, so a regen would have nothing to do.
      #
      # Runs on push to main too, not just PRs (#364): the team pushes directly
      # to main, so a PR-only gate never fires and drift was only caught hours
      # later by the nightly cron. The diff base differs by event: a PR diffs
      # against its base branch; a push diffs against the commit before it.
      - name: Require a types regen when migrations change schema DDL
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fall back to the parent commit when the base is unusable: a new
          # branch or force-push reports an all-zero / missing 'before' SHA.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          # The decision reads the ADDED and REMOVED lines of the migration diff,
          # not the whole file (#614). Grepping the whole file asked "did this file
          # change AND does it contain a CREATE TABLE anywhere", which is true of a
          # pure comment edit in any migration that ever created a table, and then
          # demanded a regen with nothing to regenerate. A pure rename (R100) moves
          # no lines, so -M keeps it out of the diff for free.
          DECISION=$(git diff -U0 -M "$BASE" HEAD -- 'supabase/migrations/*.sql' \
            | .github/scripts/db-types-regen-decision.sh)
          echo "Migration DDL decision: $DECISION"
          if [ "$DECISION" = "regen-required" ]; then
            if ! echo "$CHANGED" | grep -qx 'apps/worker/src/types/database.ts'; then
              echo "::error::A migration changes table/column/type DDL but apps/worker/src/types/database.ts was not regenerated. Run 'pnpm --filter worker db:types' and commit the result."
              exit 1
            fi
          fi
          echo "DB types freshness check passed."

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node runs the coverage checks below. Pinned rather than relying on
      # whatever the runner image happens to ship. No pnpm install: these scanners
      # read the tree and the lockfile, not node_modules.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # EVERY SCANNER BELOW RUNS WITH ITS OWN EXIT CODE DISARMED, ON PURPOSE (#779).
      #
      # This job reported success on every run from 2026-07-27 to 2026-08-14 while
      # auditing nothing at all: pnpm-lock.yaml carried a duplicated entry, Trivy
      # could not parse it, so it skipped the file, found zero targets and exited 0.
      # Its summary read `- | - | -`, where `-` means NOT SCANNED, not clean.
      # Repairing the lockfile (#778) immediately surfaced a real HIGH that had been
      # invisible for eighteen days, so the green was never evidence of anything.
      #
      # Each scanner therefore writes a machine-readable report and
      # .github/scripts/scan-coverage.mjs owns both decisions: did you cover your
      # subject, and did you find anything. Coverage is judged FIRST, because a scan
      # that covered nothing has not earned the right to report clean (LESSONS L98).
      # The checks are unit-tested in apps/web/src/lib/__tests__/scan-coverage.test.ts.

      # Dependency vulnerabilities (#263). Fails on any NEW high/critical advisory
      # in a PRODUCTION dependency. Pre-existing highs are patched via
      # pnpm.overrides (real fixes) or baselined per-advisory in .trivyignore.
      # See docs/security/dependency-audit-baseline.md.
      #
      # Replaces `pnpm audit`, which broke permanently once npm retired the legacy
      # audit endpoint (410 Gone). Trivy reads pnpm-lock.yaml directly against its
      # own maintained DB (no npm endpoint) and excludes dev/test tooling by
      # default. Binary invocation matches the gitleaks pattern below.
      - name: Dependency audit (Trivy)
        run: |
          set -euo pipefail
          VER=0.72.0
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "v${VER}"
          # A clean scan still emits a Results entry for the target with zero
          # vulnerabilities, which is what makes clean distinguishable from
          # never-scanned. An unparseable lockfile yields `Results: null`.
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 \
            --ignorefile .trivyignore --no-progress \
            --format json --output "$RUNNER_TEMP/trivy-report.json" pnpm-lock.yaml
          node .github/scripts/scan-coverage.mjs trivy "$RUNNER_TEMP/trivy-report.json" pnpm-lock.yaml

      # Secret scanning (#264). Scans the working tree for committed secrets.
      # Binary invocation avoids the org-license requirement of the v2 action.
      #
      # Gitleaks emits NO coverage signal of any kind: an empty report is what a
      # clean scan produces and also what a scan over nothing produces. So the run
      # plants a canary secret its ruleset must catch and requires it back (#779).
      # That proves more than a file count could, because an allowlist broad enough
      # to suppress every finding would leave a healthy-looking count behind. The
      # canary is generated here and never committed.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          CANARY=gitleaks-canary.tmp.txt
          trap 'rm -f "$CANARY"' EXIT
          printf 'ghp_%s\n' "$(openssl rand -hex 18)" > "$CANARY"
          ./gitleaks detect --source . --no-git --redact --no-banner --exit-code 0 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json"
          node .github/scripts/scan-coverage.mjs gitleaks "$RUNNER_TEMP/gitleaks-report.json" "$CANARY"

      # SAST (#264). Security-focused rulesets only (not style), ERROR severity, no
      # account/token needed for public rulesets. Prioritizes injection / secret /
      # node-security patterns over the Worker code-node sandbox + proxy paths.
      #
      # The required trees are named rather than counted (#779): an --exclude that
      # grows until a whole tree is unaudited still leaves a healthy-looking file
      # count behind. Measured 2026-08-14 at 576 files, 139 of them worker source.
      - name: SAST (Semgrep)
        run: |
          set -euo pipefail
          pip install --quiet semgrep
          semgrep scan --severity ERROR \
            --config p/security-audit --config p/secrets --config p/nodejs \
            --metrics off --exclude 'graphify-out' --exclude '*.test.ts' \
            --json --output "$RUNNER_TEMP/semgrep-report.json"
          node .github/scripts/scan-coverage.mjs semgrep "$RUNNER_TEMP/semgrep-report.json" \
            apps/worker/src/ apps/web/src/ apps/worker-tail/src/

  direct-push-guard:
    name: Main has no unreviewed direct push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Push to main only. On a pull request the head commit legitimately has no
    # merged PR yet, so running there would fail every single PR, and a guard
    # that is always red is a guard nobody reads.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    # Server-side branch protection is unavailable here: both
    # repos/Try-Pennie/bidspoke/rulesets and .../branches/main/protection return
    # 403 "Upgrade to GitHub Pro or make this repository public" (#266 stays open
    # on that billing decision). Merges to main deploy the production bidding
    # engine, and the husky hooks that partially cover the gap are bypassable
    # with --no-verify / SKIP_TEST_CHECK. So this reports a direct push after the
    # fact rather than preventing it.
    #
    # Two independent sources, because of LESSONS L119: GitHub's commit-to-PR
    # association index can return empty for a genuinely reviewed, merged PR and
    # can stay permanently incomplete rather than catch up. It did exactly that
    # on another repo during an API incident and paged "review bypassed" about a
    # squash merge of a green, reviewed PR. So an empty index is confirmed
    # against the PR record before anything is reported.
    #
    # Calibrated against real history on 2026-08-14, both directions: of the last
    # 20 commits on main, the 3 PR merges each resolved to a PR by
    # mergeCommit.oid, and the 6 with no association also had no PR recording
    # them, so those are true direct pushes rather than an index gap.
    steps:
      - uses: actions/checkout@v7

      - name: Check the head commit came in through a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          LOOKUPS_OK=true

          ASSOC=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq 'length' 2>/dev/null) \
            || { ASSOC=""; LOOKUPS_OK=false; }

          # The confirmation against the primary record. Asked even when ASSOC is
          # non-zero so a lookup failure here is still visible in the log.
          MERGE_SHA_PRS=$(gh pr list --state merged --limit 100 \
            --json mergeCommit --jq "[.[] | select(.mergeCommit.oid == \"${SHA}\")] | length" 2>/dev/null) \
            || { MERGE_SHA_PRS=""; LOOKUPS_OK=false; }

          echo "sha=${SHA} assoc=${ASSOC:-<failed>} prs_recording_merge=${MERGE_SHA_PRS:-<failed>} lookups_ok=${LOOKUPS_OK}"

          DECISION=$(bash .github/scripts/main-push-decision.sh "$SHA" "$ASSOC" "$MERGE_SHA_PRS" "$LOOKUPS_OK")

          if [ "$DECISION" = "violation" ]; then
            echo "::error::Commit ${SHA} was pushed directly to main, so it skipped CI gating and review. Open a pull request instead; server-side enforcement is tracked in #266."
            exit 1
          fi
          echo "OK: this commit reached main through a pull request."
