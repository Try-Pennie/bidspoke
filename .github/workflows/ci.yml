name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Test worker
        run: pnpm --filter worker test

      - name: Test web
        run: pnpm --filter web test

  a11y:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    # Runs e2e/a11y.spec.ts against THIS commit's UI (#673). Nothing ran the Playwright
    # suite automatically before, which is how six specs drifted from the app unnoticed
    # until #670: a KPI was renamed, a delete control moved behind a menu, and the specs
    # only failed when someone remembered to run them.
    #
    # Only the a11y spec runs. It creates no fixtures, so it needs no cleanup, and it is
    # the one spec whose failure is always about the UI rather than test data.
    env:
      # Baked into the client bundle at compile time, so they must be the real values:
      # a wrong NEXT_PUBLIC_WORKER_URL leaves the authenticated pages retrying a dead
      # endpoint, and the specs then time out waiting for the network to go idle.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_WORKER_URL: ${{ vars.NEXT_PUBLIC_WORKER_URL }}
      E2E_EMAIL: ${{ vars.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      BASE_URL: http://localhost:3000
      # This run creates nothing, so it must not sweep. Otherwise every PR would fire a
      # DELETE at the production Worker, and the Worker being down would fail an
      # accessibility gate. See shouldSkipTeardown in apps/web/e2e/cleanup.ts.
      E2E_SKIP_TEARDOWN: '1'
    steps:
      - uses: actions/checkout@v7

      # Dependabot PRs and forks are not given secrets, so the sign-in in global-setup
      # cannot run there. Those skip rather than fail for a credential they were never
      # going to have.
      #
      # Anything else MUST fail instead of skipping. A deleted or emptied secret would
      # otherwise skip every run, each reporting a green check, and nobody would be told:
      # a gate that quietly switches itself off is the exact rot this job exists to stop.
      - name: Check for e2e credentials
        id: creds
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "${E2E_PASSWORD}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${IS_FORK}" = "true" ] || [ "${GITHUB_ACTOR}" = "dependabot[bot]" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No E2E_PASSWORD on a fork or Dependabot PR, so the accessibility scan is skipped."
            exit 0
          fi
          echo "::error::E2E_PASSWORD is not set on a trusted run, so the accessibility scan cannot sign in. Restore the secret rather than letting this gate skip silently."
          exit 1

      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.have == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v6
        if: steps.creds.outputs.have == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.creds.outputs.have == 'true'
        run: pnpm install

      - name: Install Chromium
        if: steps.creds.outputs.have == 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The dev server, not a built artifact: `next start` cannot serve this app at all.
      # 16 pages are `runtime = 'edge'` for Cloudflare Pages, and a Node server 500s on
      # every one of them, so only /login would be scannable. The next-on-pages artifact
      # under `wrangler pages dev` is the other candidate and is worth revisiting (it is
      # what production actually runs), but it needs its own verification before it can be
      # trusted as a gate.
      #
      # Known limit either way: the dev server's CSS is not the production CSS, so a
      # contrast regression that only appears in a production build can still slip past.
      - name: Start the app
        if: steps.creds.outputs.have == 'true'
        run: |
          pnpm --filter web run dev > "${RUNNER_TEMP}/next-dev.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then
              echo "Dev server up after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Dev server did not come up within 60s."
          cat "${RUNNER_TEMP}/next-dev.log"
          exit 1

      # No warm-up step: the dev server compiles each route on first request, and the specs
      # were verified green against a cold .next (the slowest page compiled and scanned in
      # 3.6s, well inside the 30s test timeout, with a retry behind it).
      - name: Run accessibility specs
        if: steps.creds.outputs.have == 'true'
        run: pnpm --filter web exec playwright test e2e/a11y.spec.ts

      - name: Upload Playwright report
        if: failure() && steps.creds.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report
          path: apps/web/playwright-report/
          retention-days: 7

  db-types-fresh:
    name: DB types regenerated with schema migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fast reminder: if a migration changes table/column/type DDL but the
      # generated Supabase types weren't regenerated, the typed client drifts
      # from reality. Index/RLS/function/grant-only migrations don't affect the
      # types, so they're allowed through. The nightly db-types-drift workflow is
      # the authoritative correctness check against the live schema.
      #
      # Runs on push to main too, not just PRs (#364): the team pushes directly
      # to main, so a PR-only gate never fires and drift was only caught hours
      # later by the nightly cron. The diff base differs by event: a PR diffs
      # against its base branch; a push diffs against the commit before it.
      - name: Require a types regen when migrations change schema DDL
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fall back to the parent commit when the base is unusable: a new
          # branch or force-push reports an all-zero / missing 'before' SHA.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          # Only migrations whose CONTENT changed count. A pure rename (R100) alters no
          # schema, so it must not demand a types regen: renaming a migration to match the
          # version Supabase actually recorded failed this check even though the types were
          # already correct and committed. --name-status -M reports R100 for a pure rename
          # (old path in $2, new in $3); a rename WITH edits is R<100 and still counts.
          MIGS=$(git diff --name-status -M "$BASE" HEAD -- 'supabase/migrations/*.sql' | awk '
            $1 == "A" || $1 == "M" { print $2 }
            $1 ~ /^R[0-9]+$/ && $1 != "R100" { print $3 }
          ')
          if [ -z "$MIGS" ]; then
            echo "No migration content changes, nothing to check."
            exit 0
          fi
          # A column DEFAULT is not part of the generated types, so `ALTER COLUMN ... SET/DROP
          # DEFAULT` must not demand a regen: there would be nothing to regenerate and the
          # check could never be satisfied. Drop those statements before matching. Every other
          # ALTER COLUMN (a type change, SET NOT NULL) still counts, as does ADD/DROP COLUMN.
          if echo "$MIGS" | xargs cat \
               | grep -ivE 'alter[[:space:]]+column[[:space:]]+[^;]*(set|drop)[[:space:]]+default' \
               | grep -qiE 'create table|drop table|add column|drop column|alter column|rename column|create type|alter type|create view|drop view|create materialized view'; then
            if ! echo "$CHANGED" | grep -qx 'apps/worker/src/types/database.ts'; then
              echo "::error::A migration changes table/column/type DDL but apps/worker/src/types/database.ts was not regenerated. Run 'pnpm --filter worker db:types' and commit the result."
              exit 1
            fi
          fi
          echo "DB types freshness check passed."

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Dependency vulnerabilities (#263). Fails on any NEW high/critical advisory
      # in a PRODUCTION dependency. Pre-existing highs are patched via
      # pnpm.overrides (real fixes) or baselined per-advisory in .trivyignore.
      # See docs/security/dependency-audit-baseline.md.
      #
      # Replaces `pnpm audit`, which broke permanently once npm retired the legacy
      # audit endpoint (410 Gone). Trivy reads pnpm-lock.yaml directly against its
      # own maintained DB (no npm endpoint) and excludes dev/test tooling by
      # default. Binary invocation matches the gitleaks pattern below.
      - name: Dependency audit (Trivy)
        run: |
          set -euo pipefail
          VER=0.72.0
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "v${VER}"
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile .trivyignore --no-progress pnpm-lock.yaml

      # Secret scanning (#264). Scans the working tree for committed secrets.
      # Binary invocation avoids the org-license requirement of the v2 action.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --no-git --redact --no-banner --exit-code 1

      # SAST (#264). Security-focused rulesets only (not style), ERROR severity, no
      # account/token needed for public rulesets. Prioritizes injection / secret /
      # node-security patterns over the Worker code-node sandbox + proxy paths.
      - name: SAST (Semgrep)
        run: |
          set -euo pipefail
          pip install --quiet semgrep
          semgrep scan --error --severity ERROR \
            --config p/security-audit --config p/secrets --config p/nodejs \
            --metrics off --exclude 'graphify-out' --exclude '*.test.ts'
