# Dependency update automation (#263). Grouped weekly PRs for routine updates,
# plus immediate PRs for security advisories. Keep the audit baseline in
# docs/security/dependency-audit-baseline.md in sync when these land.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One PR for routine non-major bumps so the queue stays reviewable.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # vercel builds the Pages artifact through @cloudflare/next-on-pages, which
      # supports it only up to 47.0.4, so any later release fails
      # vercel-cli-pinned.test.ts and can never merge (#2791). That test holds
      # this bound to the adapter's declared range.
      - dependency-name: vercel
        versions: [">47.0.4"]
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
